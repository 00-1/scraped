name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Library crates must stay WebAssembly-compatible.
      - run: cargo build -p scraped-lang -p scraped-content -p scraped-world -p scraped-sim -p scraped-game --target wasm32-unknown-unknown
      - run: cargo clippy -p scraped-web --target wasm32-unknown-unknown -- -D warnings
      # The browser tools build, and the authoring tool works headless.
      - run: tools/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node tools/smoke/author.cjs
      - run: node tools/smoke/bench.cjs
      - run: node tools/smoke/play.cjs
      - run: node tools/smoke/app.cjs
      # WebAssembly gives the same transcripts as native code.
      - run: node tools/smoke/determinism.cjs

  # The same replay gives identical transcripts on every platform.
  determinism:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p scraped-game --test determinism

  # Fails until every required slot has Jb's own text (the M14 release gate).
  release-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -q -p scraped-cli -- content release-check

  # The Android app: built without Gradle (android/build.sh), with its
  # agent-server tests; the APK is kept as an artifact.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Signing key (if the repository has one)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then mkdir -p android/.keystore; echo "$KEYSTORE_B64" | base64 -d > android/.keystore/scraped-again.p12; fi
      - run: android/build.sh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'scraped-again' }}
      - uses: actions/upload-artifact@v4
        with:
          name: scraped-again-apk
          path: android/dist/scraped-again.apk
