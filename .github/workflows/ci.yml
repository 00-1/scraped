name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The depth bots go as deep as D01 asks (slow, so in release).
      - run: cargo test --release -p scraped-game --test depth -- --ignored
      # Library crates must stay WebAssembly-compatible.
      - run: cargo build -p scraped-lang -p scraped-content -p scraped-world -p scraped-sim -p scraped-game --target wasm32-unknown-unknown
      - run: cargo clippy -p scraped-web --target wasm32-unknown-unknown -- -D warnings
      # The browser tools build, and the authoring tool works headless.
      - run: tools/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node tools/smoke/author.cjs
      - run: node tools/smoke/bench.cjs
      - run: node tools/smoke/play.cjs
      # WebAssembly gives the same transcripts as native code.
      - run: node tools/smoke/determinism.cjs

  # The same replay gives identical transcripts on every platform.
  determinism:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p scraped-game --test determinism

  # Fails until every required slot has Jb's own text (the M14 release gate).
  release-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -q -p scraped-cli -- content release-check

  # The Android app: the Rust engine via cargo-ndk, the Compose app via
  # Gradle; the APK is kept as an artifact. Then the app is played on an
  # emulator (androidTest): the interface, the agent server, and transcripts
  # matching every other platform.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install cargo-ndk --locked
      - name: Signing key (if the repository has one)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p android/.keystore
            echo "$KEYSTORE_B64" | base64 -d > android/.keystore/scraped-again.p12
            echo "ANDROID_KEYSTORE=$PWD/android/.keystore/scraped-again.p12" >> "$GITHUB_ENV"
          fi
      - run: android/build.sh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: android/test-agent.sh
      - uses: actions/upload-artifact@v4
        with:
          name: scraped-again-apk
          path: android/dist/scraped-again.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest || { adb logcat -d | grep -E "AppTest|AndroidRuntime|scrapedagain|FATAL|TestRunner" | tail -300; exit 1; }
