name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Library crates must stay WebAssembly-compatible.
      - run: cargo build -p scraped-lang -p scraped-content -p scraped-world --target wasm32-unknown-unknown
      - run: cargo clippy -p scraped-web --target wasm32-unknown-unknown -- -D warnings
      # The browser tools build, and the authoring tool works headless.
      - run: tools/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node tools/smoke/author.cjs
      - run: node tools/smoke/bench.cjs

  # Fails until every required slot has Jb's own text (the M14 release gate).
  release-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -q -p scraped-cli -- content release-check
