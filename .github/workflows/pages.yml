# Publishes the authoring tool, the language bench, the browser player and
# the list of released player builds to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [claude/laughing-edison-9brdzg]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fails harmlessly until Pages is switched on (Settings → Pages →
    # Source: GitHub Actions); remove this line once it is.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: tools/build.sh
      - run: |
          mkdir -p _site
          cp tools/dist/author.html tools/dist/bench.html tools/dist/play.html _site/
          cp tools/site/index.html _site/
      - run: tools/site/players.sh "$GITHUB_REPOSITORY" _site/players.html
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
