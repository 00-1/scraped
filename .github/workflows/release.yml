# The release gate and release binaries. Push a tag like v1.0.0 to release;
# run by hand (Actions → Release → Run workflow) to try the gate, or give
# the run a tag to release the commit it runs on under that tag (for
# sessions that may push branches but not tags).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release this commit as this tag (e.g. v0.1.0); empty only tries the gate"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Everything that must hold before a release.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The version is bumped at least as far as the change needs.
      - name: Version bump
        run: |
          last=$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$last" ]; then
            cargo run -q --release -p scraped-cli -- saves check --against "$last"
          fi
      # No empty required slots, no example variants, no lint errors.
      # DESIGN-Q: for v0.x play builds (S03) this only reports, since the
      # text still waits on Jb; from v1.0.0 it blocks the release.
      - run: cargo run -q -p scraped-cli -- content release-check
        continue-on-error: ${{ startsWith(inputs.tag || github.ref_name, 'v0.') }}
      # Every seed of a batch, at every difficulty, gives a fair world.
      - run: cargo run -q --release -p scraped-cli -- fair --seeds 1-50 --all
      # The browser builds, works headless, and matches native transcripts.
      - run: tools/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node tools/smoke/author.cjs
      - run: node tools/smoke/bench.cjs
      - run: node tools/smoke/play.cjs
      - run: node tools/smoke/determinism.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: browser
          path: tools/dist/play.html

  determinism:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p scraped-game --test determinism

  binaries:
    needs: [gate, determinism]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            ext: ""
          - os: macos-latest
            name: macos-arm64
            ext: ""
          - os: windows-latest
            name: windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p scraped-play
      # The player program: spoilers compiled out, text baked in, stripped.
      - run: cargo build --profile player -p scraped-play --bin scraped-player --no-default-features
      - shell: bash
        run: |
          mkdir -p dist/scraped-${{ matrix.name }} dist/player
          cp target/release/scraped${{ matrix.ext }} target/release/scraped-mcp${{ matrix.ext }} dist/scraped-${{ matrix.name }}/
          cp -r content docs/PROTOCOL.md docs/coop dist/scraped-${{ matrix.name }}/
          cp target/player/scraped-player${{ matrix.ext }} dist/player/scraped-player-${{ matrix.name }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: player-${{ matrix.name }}
          path: dist/player
      - uses: actions/upload-artifact@v4
        with:
          name: scraped-${{ matrix.name }}
          path: dist/scraped-${{ matrix.name }}

  android:
    needs: [gate, determinism]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install cargo-ndk --locked
      - name: Signing key (if the repository has one)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p android/.keystore
            echo "$KEYSTORE_B64" | base64 -d > android/.keystore/scraped-again.p12
            echo "ANDROID_KEYSTORE=$PWD/android/.keystore/scraped-again.p12" >> "$GITHUB_ENV"
          fi
      - run: android/build.sh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: android/test-agent.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/dist/scraped-again.apk

  publish:
    needs: [binaries, android]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          cd artifacts
          for d in scraped-*; do (cd "$d" && zip -qr "../$d.zip" .); done
      # Every player build with its checksum, kept with its release so old
      # builds stay downloadable (the Pages site lists them all).
      - run: |
          mkdir -p players
          cp artifacts/player-*/scraped-player-* players/
          cp artifacts/browser/play.html players/scraped-player-browser.html
          (cd players && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            players/*
            artifacts/*.zip
            artifacts/browser/play.html
            artifacts/android/scraped-again.apk
