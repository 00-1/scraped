<title>Scraped Again Authoring</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a writer's desk. Slot list on the left like a card index, the open slot on the right: brief, variants being written, previews from real worlds. */
:root {
  --bg: #e9ebe6; --sheet: #f6f7f3; --ink: #22262b; --muted: #5d6560; --rule: #cdd2cb;
  --accent: #2d6f63; --accent-soft: #d5e5df; --warn: #9a6a12; --warn-soft: #f3e6c8; --bad: #a33a2c; --bad-soft: #f4d9d4;
  --var: #2d6f63; --kw: #7a4f2a;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16191c; --sheet: #1e2226; --ink: #e4e7e2; --muted: #9aa39d; --rule: #343a3f;
  --accent: #7cc2b2; --accent-soft: #233a35; --warn: #e4b45c; --warn-soft: #3a3020; --bad: #f08a7a; --bad-soft: #3d2420;
  --var: #7cc2b2; --kw: #e0aa78; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #16191c; --sheet: #1e2226; --ink: #e4e7e2; --muted: #9aa39d; --rule: #343a3f;
  --accent: #7cc2b2; --accent-soft: #233a35; --warn: #e4b45c; --warn-soft: #3a3020; --bad: #f08a7a; --bad-soft: #3d2420;
  --var: #7cc2b2; --kw: #e0aa78; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between; }
h1 { font-family: var(--display); font-weight: 700; letter-spacing: .08em; font-size: clamp(1.4rem, 3vw, 1.9rem); margin: 0; }
.mono, .status { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; }
.bar .grow { flex: 1 1 12rem; min-width: 0; }
button, .filebtn { font: 500 .82rem var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
button:hover, .filebtn:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--sheet); border-color: var(--accent); }
button.ghost { background: none; }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.filebtn input { display: none; }
.layout { display: grid; grid-template-columns: minmax(15rem, 19rem) 1fr; gap: 14px; align-items: start; }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
aside { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 10px; display: grid; gap: 8px; position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100vh; overflow: auto; }
@media (max-width: 760px) { aside { position: static; max-height: none; } }
aside input[type=search] { width: 100%; font: .9rem var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 8px; }
.family { font: 500 .7rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 8px 4px 2px; }
.slotlink { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 1px solid transparent; background: none; padding: 6px 8px; }
.slotlink[aria-current=true] { background: var(--accent-soft); border-color: var(--accent); }
.chip { font: 500 .66rem var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
.chip.ok { background: var(--accent-soft); color: var(--accent); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
main { display: grid; gap: 14px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.card h2 { font-family: var(--mono); font-size: 1.05rem; margin: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.card h3 { font-family: var(--display); font-size: .95rem; letter-spacing: .1em; margin: 0; }
.brief { margin: 0; max-width: 72ch; }
table.vars { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.vars td, table.vars th { text-align: left; vertical-align: top; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--rule); }
table.vars th { font: 500 .7rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
table.vars code, .ex { font-family: var(--mono); font-size: .84rem; }
.ex { color: var(--muted); overflow-wrap: anywhere; }
.scroll { overflow-x: auto; }
.variant { border: 1px solid var(--rule); border-radius: 5px; padding: 10px; display: grid; gap: 8px; background: var(--bg); }
.variant.example { border-style: dashed; }
.editor { position: relative; font: .95rem/1.5 var(--mono); }
.editor pre, .editor textarea { margin: 0; padding: 8px 10px; font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--rule); border-radius: 4px; min-height: 3.4em; }
.editor pre { color: var(--ink); background: var(--sheet); pointer-events: none; }
.editor textarea { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; color: transparent; caret-color: var(--ink); background: transparent; overflow: hidden; }
.editor textarea::selection { background: var(--accent-soft); color: transparent; }
.hl-var { color: var(--var); font-weight: 500; }
.hl-kw { color: var(--kw); font-weight: 500; }
.row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.row label { font: .78rem var(--mono); color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.row input[type=text] { font: .85rem var(--mono); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 4px 6px; min-width: 14rem; }
.row input[type=number] { font: .85rem var(--mono); width: 4.5rem; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 4px 6px; }
.issues { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; font-size: .88rem; }
.issues li { padding: 4px 8px; border-radius: 3px; }
.issues li.error { background: var(--bad-soft); color: var(--bad); }
.issues li.warning { background: var(--warn-soft); color: var(--warn); }
table.preview { border-collapse: collapse; width: 100%; }
table.preview td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.preview td.out { font-size: 1rem; }
table.preview svg { width: 40px; height: 40px; color: var(--ink); }
.empty { color: var(--muted); font-style: italic; }
.form { display: grid; grid-template-columns: max-content 1fr; gap: 8px 12px; align-items: center; }
.form > label { font: .78rem var(--mono); color: var(--muted); }
.form input[type=text], .form select, .form textarea { font: .85rem var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 4px 6px; min-width: 0; width: 100%; }
.form textarea { min-height: 3.2em; resize: vertical; }
.checks { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.checks label { font: .8rem var(--mono); display: inline-flex; gap: 4px; align-items: center; }
@media (max-width: 560px) { .form { grid-template-columns: 1fr; } }
.beats { display: flex; flex-wrap: wrap; gap: 6px; }
nav.modes { display: flex; flex-wrap: wrap; gap: 6px; }
nav.modes button[aria-pressed=true], [data-inspect][aria-pressed=true], [data-insp-era][aria-pressed=true] { background: var(--accent); color: var(--sheet); border-color: var(--accent); }
.playgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .playgrid { grid-template-columns: 1fr; } }
.editorcol { display: grid; gap: 14px; min-width: 0; }
.playlog { max-height: 60vh; overflow: auto; border: 1px solid var(--rule); border-radius: 4px; padding: 8px 10px; background: var(--bg); }
.playlog pre { margin: 0 0 10px; white-space: pre-wrap; font: .92rem/1.5 var(--body); }
.playlog .cmd { display: flex; justify-content: space-between; font: .82rem var(--mono); color: var(--accent); }
.playlog button.line { all: unset; cursor: pointer; border-radius: 2px; }
.playlog button.line:hover, .playlog button.line:focus-visible { background: var(--accent-soft); outline: 1px solid var(--accent); }
.whybox { border: 1px solid var(--accent); border-radius: 4px; padding: 6px 10px; background: var(--accent-soft); font-size: .9rem; }
.whybox p { margin: 2px 0; }
.variant.flash { outline: 3px solid var(--accent); }
.glyphs { display: flex; flex-wrap: wrap; gap: 6px; }
.glyphs figure { margin: 0; text-align: center; width: 56px; }
.glyphs svg { width: 40px; height: 40px; color: var(--ink); }
.glyphs figcaption { font: .7rem var(--mono); color: var(--muted); }
pre.sheet { white-space: pre-wrap; font: .78rem/1.4 var(--mono); max-height: 50vh; overflow: auto; }
ins { color: var(--accent); text-decoration: none; } del { color: var(--bad); }
.help { font-size: .88rem; color: var(--muted); }
.help code { font-family: var(--mono); font-size: .82rem; color: var(--ink); }
footer { color: var(--muted); font-size: .85rem; }
</style>
<div class="wrap">
  <header>
    <h1>Scraped Again · Authoring</h1>
    <span class="status" id="build"></span>
  </header>
  <div class="bar">
    <span id="projectNote" class="status" hidden></span>
    <button type="button" id="open" class="primary" title="Open the repository's content folder and save straight into it (Chrome or Edge)">Open content folder</button>
    <button type="button" id="save" disabled>Save to folder</button>
    <label class="filebtn" title="Load .toml files or a .zip of them">Import files<input type="file" id="import" accept=".toml,.zip" multiple></label>
    <button type="button" id="exportZip">Export zip</button>
    <button type="button" id="copyFile" title="Copy the open slot's file as TOML, to paste into GitHub">Copy file</button>
    <span class="grow status" id="packStatus">Loading engine…</span>
  </div>
  <nav class="modes" aria-label="Mode"><button type="button" data-mode="write" aria-pressed="true">Write</button><button type="button" data-mode="play" aria-pressed="false">Playtest</button><button type="button" data-mode="gaps" aria-pressed="false">Gaps</button><button type="button" data-mode="voice" aria-pressed="false">Voice</button><button type="button" data-mode="inspect" aria-pressed="false">Inspect</button><button type="button" data-mode="changes" aria-pressed="false">Changes</button></nav>
  <div class="layout" id="writeLayout">
    <aside>
      <input type="search" id="search" placeholder="Find a slot" aria-label="Find a slot">
      <div class="row" style="gap:6px"><label class="mono" style="font-size:.78rem;display:inline-flex;gap:4px;align-items:center"><input type="checkbox" id="reviewMode"> Review order</label><button type="button" id="nextToWrite" title="The next slot, in review order, that isn't done">Next to write</button></div>
      <form id="newStorylet" class="row" style="gap:6px"><input type="text" id="newStoryletId" placeholder="new_storylet_id" aria-label="New storylet id" style="flex:1;min-width:0;font:.85rem var(--mono);padding:4px 6px;border:1px solid var(--rule);border-radius:4px;background:var(--bg);color:var(--ink)"><button type="submit">New storylet</button></form>
      <div id="slotList"></div>
    </aside>
    <main id="main"><div class="card"><p class="empty">Loading…</p></div></main>
  </div>
  <div id="modeView" hidden></div>
  <footer>Drafts are kept in this browser until saved (on claude.ai they save to the project as you type). Template language: see <code>content/README.md</code>. The engine runs here as WebAssembly, so previews are real generated worlds.</footer>
</div>
<script>
const BUILD = __BUILD__;
const BUNDLED = __CONTENT__;
const ENGINE_B64 =
"__ENGINE__";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

let engine, registry, schema;
const state = { pack: { files: [] }, saved: "", slot: null, lint: { issues: [], coverage: [] }, dir: null, seed: "42", spoil: false, search: "", db: null, downloads: null, written: {}, syncing: false };
// Inside the claude.ai viewer the page is a cross-origin frame: no folder
// picker, but the artifact's own database, which Claude reads into content/.
const IN_FRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

function api(req) {
  const bytes = new TextEncoder().encode(JSON.stringify(req));
  const ptr = engine.alloc(bytes.length);
  new Uint8Array(engine.memory.buffer, ptr, bytes.length).set(bytes);
  const out = engine.call(ptr, bytes.length);
  return JSON.parse(new TextDecoder().decode(new Uint8Array(engine.memory.buffer, out, engine.output_len())));
}

function showBuild() {
  const mins = Math.max(0, Math.round((Date.now() - Date.parse(BUILD.time)) / 60000));
  const ago = mins < 1 ? "just now" : mins < 60 ? `${mins} min ago` : mins < 2880 ? `${Math.round(mins / 60)} h ago` : `${Math.round(mins / 1440)} days ago`;
  $("build").textContent = `Build ${BUILD.commit} · built ${ago}`;
}
showBuild(); setInterval(showBuild, 30000);

// ---------- pack state ----------
const packKey = () => JSON.stringify(state.pack);
function dirty() { return packKey() !== state.saved; }
function setPack(pack, markSaved) {
  state.pack = pack;
  if (markSaved) state.saved = packKey();
  persist();
  relint();
}
function persist() { store("author.pack", packKey()); store("author.saved", state.saved); scheduleSync(); hotReload(); }

// ---------- project database (claude.ai) ----------
const docId = path => path.replace(/\.toml$/, "").replace(/[^A-Za-z0-9_.~:@+-]/g, "_");
let syncTimer;
function scheduleSync() {
  if (!state.db) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncToProject, 1500);
}
async function syncToProject() {
  if (!state.db || state.syncing) { if (state.db) scheduleSync(); return; }
  state.syncing = true;
  try {
    for (const f of textsOf(state.pack)) {
      if (state.written[f.path] === f.text) continue;
      await state.db.collection("content").doc(docId(f.path)).set({ path: f.path, text: f.text, updated: new Date().toISOString() });
      state.written[f.path] = f.text;
    }
    state.saved = packKey(); store("author.saved", state.saved);
    updateStatus();
  } catch (err) {
    $("packStatus").textContent = "Saving to the project failed: " + (err.code || err.message) + ". Your drafts are still kept in this browser.";
  } finally { state.syncing = false; }
}
/** The project's files win; bundled example variants fill in slots a project file has none for. */
function mergeProject(bundled, files) {
  const pack = packFromTexts(files);
  for (const b of bundled.files) {
    const f = pack.files.find(f => f.path === b.path);
    if (!f) { pack.files.push(b); continue; }
    const have = new Set(f.variants.map(v => v.slot));
    f.variants.push(...b.variants.filter(v => !have.has(v.slot)));
    const ids = new Set((f.storylets || []).map(s => s.id));
    const extra = (b.storylets || []).filter(s => !ids.has(s.id));
    if (extra.length) f.storylets = [...(f.storylets || []), ...extra];
  }
  pack.files.sort((a, b) => a.path.localeCompare(b.path));
  return pack;
}
function fileFor(slotId) {
  const family = slotId.split(".")[0];
  const path = `${family}.toml`;
  let f = state.pack.files.find(f => f.path === path);
  if (!f) { f = { path, variants: [] }; state.pack.files.push(f); state.pack.files.sort((a, b) => a.path.localeCompare(b.path)); }
  return f;
}
function variantsOf(slotId) {
  const out = [];
  state.pack.files.forEach(f => f.variants.forEach((v, i) => { if (v.slot === slotId) out.push({ file: f, index: i, v }); }));
  return out;
}

let lintTimer;
function relint() {
  clearTimeout(lintTimer);
  lintTimer = setTimeout(() => {
    state.lint = api({ cmd: "lint", pack: state.pack });
    registry = api({ cmd: "registry", pack: state.pack });
    renderList(); renderSlotIssues(); renderBeats(); updateStatus();
  }, 250);
}
function updateStatus() {
  const errors = (state.lint.issues || []).filter(i => i.severity === "error").length;
  const where = state.db ? "the project" : state.dir ? `folder “${state.dir.name}”` : "this browser";
  $("packStatus").textContent = `${dirty() ? (state.db ? "Saving…" : "Unsaved changes") : "All changes saved"} (${where}) · pack ${state.lint.version || "…"} · ${errors} error${errors === 1 ? "" : "s"}`;
  $("save").disabled = !state.dir || !dirty();
}

// ---------- slot list ----------
const STATUS = { "empty": ["bad", "empty"], "example-only": ["warn", "example only"], "under-filled": ["warn", "needs more"], "partial": ["warn", "gaps"], "ok": ["ok", "done"] };
function covOf(id) { return (state.lint.coverage || []).find(c => c.slot === id); }
function renderList() {
  const q = state.search.toLowerCase();
  let fams = {};
  registry.slots.filter(s => !q || s.id.includes(q) || s.description.toLowerCase().includes(q)).forEach(s => (fams[s.family] ||= []).push(s));
  if (state.review) {
    const stage = Object.fromEntries((registry.review || []).map(r => [r.family, r.stage]));
    fams = Object.fromEntries(reviewOrder().filter(f => fams[f]).map(f => {
      const done = fams[f].filter(s => { const c = covOf(s.id); return c && c.status === "ok" && !c.errors; }).length;
      return [`${f} · ${stage[f] || "other"} · ${done}/${fams[f].length} done`, fams[f]];
    }));
  }
  $("slotList").innerHTML = Object.entries(fams).map(([fam, slots]) => `<div class="family">${esc(fam)}</div>` + slots.map(s => {
    const c = covOf(s.id);
    const [cls, label] = c ? (c.errors ? ["bad", `${c.errors} error${c.errors > 1 ? "s" : ""}`] : STATUS[c.status]) : ["warn", "…"];
    return `<button type="button" class="slotlink" data-slot="${esc(s.id)}" aria-current="${s.id === state.slot}"><span class="mono" style="color:var(--ink)">${esc(s.id)}</span><span class="chip ${cls}">${label}</span></button>`;
  }).join("")).join("") || `<p class="empty">No slot matches.</p>`;
}

// ---------- slot page ----------
function typeLabel(t) { return t.kind === "enum" ? `one of: ${t.values.join(", ")}` : t.kind; }
function highlight(text) {
  return esc(text).replace(/(\{&gt;[^}]*\}|\{[^{}]*\})/g, m => m.startsWith("{&gt;") ? `<span class="hl-kw">${m}</span>` : `<span class="hl-var">${m}</span>`)
    .replace(/(\[(?:if [^\]]*|else|end|damaged)\])/g, '<span class="hl-kw">$1</span>') + "\n";
}
function renderSlot() {
  const s = registry.slots.find(x => x.id === state.slot);
  const target = currentMain(); if (!target) return;
  if (!s) { target.innerHTML = `<div class="card"><p class="empty">Choose a slot${state.mode === "play" ? ": click a line of the playtest" : " on the left"}.</p></div>`; return; }
  const vs = variantsOf(s.id);
  const c = covOf(s.id);
  target.innerHTML = `
    <section class="card">
      <h2>${esc(s.id)} ${c ? `<span class="chip ${STATUS[c.status][0]}">${STATUS[c.status][1]}</span>` : ""}</h2>
      <p class="brief">${esc(s.description)}</p>
      <p class="help">Needs ${s.min_variants} written variant${s.min_variants > 1 ? "s" : ""}${s.required ? "" : " (optional for release)"} · at most ${s.max_len} characters · file <code>${esc(s.family)}.toml</code></p>
      <div class="scroll"><table class="vars"><thead><tr><th>Variable</th><th>Type</th><th>Meaning</th><th>Example values</th></tr></thead><tbody>
        ${s.variables.map(v => `<tr><td><code>{${esc(v.name)}}</code></td><td class="ex">${esc(typeLabel(v.type))}</td><td>${esc(v.description)}</td><td class="ex">${esc([...new Set(s.examples.map(e => Array.isArray(e[v.name]) ? e[v.name].join(" · ") : String(e[v.name])))].slice(0, 3).join(" | "))}</td></tr>`).join("") || `<tr><td colspan="4" class="empty">No variables.</td></tr>`}
      </tbody></table></div>
      <ul class="issues" id="slotIssues"></ul>
    </section>
    ${storyletOf(s.id) ? storyletCard(storyletOf(s.id).s) : ""}
    <section class="card">
      <div class="row" style="justify-content:space-between"><h3>Variants</h3><button type="button" id="addVariant" class="primary">Add variant</button></div>
      ${vs.length ? vs.map((x, n) => variantCard(x, n, vs.length)).join("") : `<p class="empty">No variants yet. Add one, then watch the preview below.</p>`}
      <p class="help">Helpers: ${registry.helpers.map(h => `<code>${esc(h.usage.split(":")[0])}</code>`).join(" ")} · <code>{>slot.id}</code> · <code>[if cond]…[else]…[end]</code></p>
    </section>
    <section class="card">
      <div class="row" style="justify-content:space-between">
        <h3>Preview</h3>
        <div class="row">
          <label for="seed">Seed <input type="number" id="seed" value="${esc(state.seed)}" min="0"></label>
          <button type="button" id="newSeed">New seed</button>
          <label for="spoil"><input type="checkbox" id="spoil" ${state.spoil ? "checked" : ""}> Show spoilers</label>
        </div>
      </div>
      <div class="scroll"><table class="preview" id="preview"></table></div>
    </section>
    <section class="card">
      <h3>In a response</h3>

}
function showWhy(n, r) {
  const e = state.play.log[n], x = e.renders[r];
  state.slot = x.slot; store("author.slot", state.slot);
  const vars = Object.entries(x.vars || {}).map(([k, v]) => `${k}=${Array.isArray(v) ? `[${v.join(", ")}]` : v}`).join("  ");
  $("why").innerHTML = `<div class="whybox"><p><strong class="mono">${esc(x.slot)}</strong> · ${x.file != null ? `variant ${x.variant + 1} of <code>${esc(x.file)}</code>${x.example ? " (an example)" : ""}` : "no variant applied: a placeholder"}${x.branches.length ? ` · [if] branches: ${x.branches.map(b => b ? "first" : "else").join(", ")}` : ""}${x.depth ? " · called from another slot" : ""}</p><p class="ex">${esc(vars) || "no variables"}</p></div>`;
  renderSlot();
  if (x.file != null) {
    const el = document.querySelector(`.variant[data-file="${CSS.escape(x.file)}"][data-index="${x.variant}"]`);
    if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600); }
  }
}

// ---------- gaps ----------
function renderGaps() {
  const g = state.gaps;
  $("modeView").innerHTML = `<section class="card">
    <div class="row" style="justify-content:space-between"><h3>Gaps players will meet</h3>
      <div class="row"><label for="gapSeeds">Worlds <input type="text" id="gapSeeds" value="${esc(state.gapSeeds || "1 42 7 99")}"></label><label for="gapSteps">Commands each <input type="number" id="gapSteps" value="${esc(state.gapSteps || "120")}" min="10" max="1000"></label><button type="button" id="runGaps" class="primary">Run bots</button></div></div>
    <p class="help">Two bots play each world: a curious explorer who never writes, and a scholar who knows the grammar and goes as deep as it can. Slots are ranked by how often a player meets a placeholder or an example per hour of play: write the top ones first.</p>
    <div id="gapOut">${g ? gapTables(g) : `<p class="empty">Not run yet.</p>`}</div>
  </section>`;
}
function gapTables(g) {
  const gaps = g.slots.filter(s => s.gaps > 0);
  const more = g.slots.filter(s => s.needs_more);
  const fall = g.slots.filter(s => s.fallbacks.length);
  return `<p class="help">${g.runs} runs, ${g.hours.toFixed(1)} hours of play, ${g.slots.length} slots met, ${g.never.length} never.</p>
    <h3>Most-met gaps</h3><div class="scroll"><table class="vars"><thead><tr><th>Slot</th><th>Gaps / hour</th><th>Seen / hour</th><th>Variants used</th><th>Branches</th></tr></thead><tbody>
    ${gaps.slice(0, 40).map(s => `<tr><td>${slotButton(s.slot)}</td><td>${s.gap_hours.toFixed(2)}</td><td>${s.per_hour.toFixed(2)}</td><td class="ex">${esc(Object.entries(s.variants).map(([k, n]) => `${k} ×${n}`).join(", "))}</td><td class="ex">${esc(Object.entries(s.branches).filter(([, b]) => b.length).map(([k, b]) => `${k}: ${b.map(([t, f]) => `${t}/${f}`).join(" ")}`).join("; "))}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">No gaps met.</td></tr>`}</tbody></table></div>
    <h3>Seen too often</h3><p class="help">In a typical run the same variant shows this many times; add variants.</p>
    <ul class="issues">${more.map(s => `<li class="warning">${slotButton(s.slot)} the same variant ${s.same_per_run.toFixed(1)}× a run, out of ${s.renders_per_run.toFixed(1)}</li>`).join("") || `<li class="empty">Nothing repeats too much.</li>`}</ul>
    <h3>Common situations getting generic text</h3><p class="help">These slots have conditional variants, but these situations fell through to a general one.</p>
    <ul class="issues">${fall.map(s => `<li class="warning">${slotButton(s.slot)} ${s.fallbacks.map(([c, n]) => `<code>${esc(c)}</code> ×${n}`).join(" · ")}</li>`).join("") || `<li class="empty">None.</li>`}</ul>
    <h3>Never reached</h3><p class="help">No bot met these; check whether players can, or whether the slot can go.</p>
    <p class="beats">${g.never.map(id => slotButton(id)).join("")}</p>`;
}

  $("modeView").innerHTML = `<section class="card"><h3>Your recurring words and phrases</h3>
    <p class="help">From your own variants only (examples don't count).</p>
    <div class="scroll"><table class="vars"><thead><tr><th>Phrase</th><th>Uses</th><th>Where</th></tr></thead><tbody>
    ${v.glossary.slice(0, 80).map(p => `<tr><td>${esc(p.text)}</td><td>${p.count}</td><td>${p.slots.map(s => slotButton(s)).join(" ")}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">Nothing written yet.</td></tr>`}</tbody></table></div></section>
    <section class="card"><h3>Echoes</h3><ul class="issues">${v.echoes.map(i => `<li class="warning">${slotButton(i.slot)} ${esc(i.message)}</li>`).join("") || `<li class="empty">No phrase repeats across slots.</li>`}</ul></section>
    <section class="card"><h3>Length and rhythm by family</h3><div class="scroll"><table class="vars"><thead><tr><th>Family</th><th>Variants</th><th>Mean length</th><th>Median</th><th>Words per sentence</th></tr></thead><tbody>
    ${v.stats.map(s => `<tr><td>${esc(s.family)}</td><td>${s.variants}</td><td>${s.mean_chars.toFixed(0)}</td><td>${s.median_chars}</td><td>${s.words_per_sentence.toFixed(1)}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">Nothing written yet.</td></tr>`}</tbody></table></div></section>`;
}

// ---------- inspect ----------
function renderInspect() {
  const tab = state.inspect || "language";
  $("modeView").innerHTML = `<section class="card"><div class="row" style="justify-content:space-between"><h3>Inspect (spoilers)</h3>
    <div class="row">${["language", "world", "run"].map(t => `<button type="button" data-inspect="${t}" aria-pressed="${t === tab}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}<label for="inspSeed">World <input type="number" id="inspSeed" value="${esc(state.play ? state.play.seed : state.seed)}" min="0"></label></div></div>
    <div id="inspectOut"></div></section>`;
  const seed = $("inspSeed").value || "42", out = $("inspectOut");
  if (tab === "language") {
    const b = api({ cmd: "bench", seed, count: 12 });
    const era = b.eras[Math.min(state.inspEra || 0, b.eras.length - 1)];
    out.innerHTML = `<div class="row">${b.eras.map((e, i) => `<button type="button" data-insp-era="${i}" aria-pressed="${e === era}">Era ${e.era}</button>`).join("")}<input type="search" id="lexSearch" placeholder="Find a word or meaning" value="${esc(state.lexQ || "")}"></div>
      <div class="glyphs">${era.sheet.script.glyphs.map(g => `<figure title="${esc(g.description)}">${g.svg}<figcaption>${g.number} ${esc(g.roman)}</figcaption></figure>`).join("")}</div>
      <div class="scroll"><table class="vars" id="lexTable"><thead><tr><th>Meaning</th><th>Root</th><th>Domain</th></tr></thead><tbody>${era.sheet.lexicon.filter(l => !state.lexQ || (l.concept + " " + l.root).includes(state.lexQ)).map(l => `<tr><td>${esc(l.concept)}</td><td class="mono">${esc(l.root)}</td><td class="ex">${esc(l.domain)}</td></tr>`).join("")}</tbody></table></div>
      <details><summary class="help">Full grammar sheet</summary><pre class="sheet">${esc(era.sheetText)}</pre></details>`;
  } else if (tab === "world") {
    const w = api({ cmd: "world", seed });
    out.innerHTML = `<canvas id="inspMap" style="max-width:100%;image-rendering:pixelated"></canvas>
      <details open><summary class="help">History</summary><pre class="sheet">${esc(w.timeline)}</pre></details>
      <details><summary class="help">Surfaces and live claims</summary><pre class="sheet">${esc(api({ cmd: "writing", seed }).text)}</pre></details>
      <details><summary class="help">Regions over half a year</summary><pre class="sheet">${esc(api({ cmd: "regions", seed, days: 180 }).text)}</pre></details>`;
    const c = $("inspMap"), scale = 3; c.width = c.height = w.side * scale;
    const ctx = c.getContext("2d"), img = ctx.createImageData(w.side, w.side), px = Uint8Array.from(atob(w.pixels), ch => ch.charCodeAt(0));
    for (let i = 0, j = 0; i < px.length; i += 3, j += 4) { img.data[j] = px[i]; img.data[j + 1] = px[i + 1]; img.data[j + 2] = px[i + 2]; img.data[j + 3] = 255; }
    const tmp = document.createElement("canvas"); tmp.width = tmp.height = w.side; tmp.getContext("2d").putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false; ctx.drawImage(tmp, 0, 0, c.width, c.height);
  } else {
    if (!state.play) { out.innerHTML = `<p class="empty">Start a playtest first; this shows what that run knows and has done.</p>`; return; }
    const r = api({ cmd: "play_inspect" });
    const u = Object.entries(r.understanding || {}).sort((a, b) => b[1] - a[1]);
    out.innerHTML = `<p class="help">Words can be written once met in ${r.threshold} texts.</p>
      <div class="scroll"><table class="vars"><thead><tr><th>Root</th><th>Texts met in</th></tr></thead><tbody>${u.map(([k, n]) => `<tr><td>${esc(k)}</td><td>${n}${n >= r.threshold ? " ✓" : ""}</td></tr>`).join("") || `<tr><td colspan="2" class="empty">Nothing read yet.</td></tr>`}</tbody></table></div>
      <details><summary class="help">Not met yet (${r.unmet.length})</summary><p class="ex">${esc(r.unmet.join(", "))}</p></details>
      <details><summary class="help">Run record</summary><pre class="sheet">${esc(JSON.stringify(r.record, null, 2))}</pre></details>
      <details><summary class="help">Storylets, claims here, regions</summary><pre class="sheet">${esc(JSON.stringify({ storylets: r.storylets, claims_here: r.claims_here, regions: r.regions }, null, 2))}</pre></details>`;
  }
}

// ---------- changes ----------
function renderChanges() {
  const d = api({ cmd: "diff", pack: state.pack, old_files: BUNDLED });
  const row = (c, kind) => `<li class="${kind === "removed" ? "error" : "warning"}">${slotButton(c.slot)} ${kind}${c.before != null && kind !== "added" ? `<br><del>${esc(c.before)}</del>` : ""}${c.after != null && kind !== "removed" ? `<br><ins>${esc(c.after)}</ins>` : ""}</li>`;
  const n = d.added.length + d.removed.length + d.changed.length;
  $("modeView").innerHTML = `<section class="card"><h3>Changes since the committed pack</h3>
    ${d.breaks_saves ? `<p class="issues"><span class="chip bad">saves</span> Storylets changed (${d.storylets.map(esc).join(", ")}): saved games will replay differently, because where and when storylets happen has changed.</p>` : `<p class="help">${n ? "Only text has changed: saved games replay exactly, with the new wording." : "Nothing has changed."}</p>`}
    <ul class="issues">${d.changed.map(c => row(c, "changed")).join("")}${d.added.map(c => row(c, "added")).join("")}${d.removed.map(c => row(c, "removed")).join("")}</ul></section>`;
}

// ---------- files ----------
function packFromTexts(files) {
  const r = api({ cmd: "parse", files });
  if (r.errors.length) $("packStatus").textContent = "Some files could not be read: " + r.errors.map(e => `${e.path}: ${e.message}`).join("; ");
  return r.pack;
}
function textsOf(pack) { return api({ cmd: "write", pack }).files; }

$("open").addEventListener("click", async () => {
  if (!window.showDirectoryPicker) { $("packStatus").textContent = "This browser cannot open folders. Use Chrome or Edge, or Import / Export zip / Copy file instead."; return; }
  try {
    const dir = await window.showDirectoryPicker({ mode: "readwrite" });
    const files = [];
    for await (const [name, h] of dir.entries()) if (h.kind === "file" && name.endsWith(".toml")) files.push({ path: name, text: await (await h.getFile()).text() });
    if (!files.length) $("packStatus").textContent = `“${dir.name}” has no .toml files yet; new files will be created there when you save.`;
    state.dir = dir;
    setPack(packFromTexts(files), true);
    renderSlot();
  } catch (err) { if (err.name !== "AbortError") $("packStatus").textContent = "Could not open the folder: " + err.message; }
});
$("save").addEventListener("click", async () => {
  if (!state.dir) return;
  try {
    for (const f of textsOf(state.pack)) {
      const h = await state.dir.getFileHandle(f.path, { create: true });
      const w = await h.createWritable(); await w.write(f.text); await w.close();
    }
    state.saved = packKey(); persist(); updateStatus();
  } catch (err) { $("packStatus").textContent = "Saving failed: " + err.message; }
});
$("copyFile").addEventListener("click", () => {
  if (!state.slot) return;
  const path = `${state.slot.split(".")[0]}.toml`;
  const f = textsOf(state.pack).find(f => f.path === path);
  if (!f) return;
  navigator.clipboard.writeText(f.text).then(
    () => { $("packStatus").textContent = `Copied ${path}. Paste it over content/${path} in the repository.`; },
    () => { $("packStatus").textContent = "Copying was blocked here; use Export zip or Open content folder instead."; });
});
$("import").addEventListener("change", async e => {
  const files = [];
  for (const file of e.target.files) {
    if (file.name.endsWith(".zip")) files.push(...await unzip(new Uint8Array(await file.arrayBuffer())));
    else files.push({ path: file.name, text: await file.text() });
  }
  e.target.value = "";
  if (files.length) { setPack(packFromTexts(files.filter(f => f.path.endsWith(".toml"))), false); renderSlot(); }
});
$("exportZip").addEventListener("click", async () => {
  const blob = new Blob([zip(textsOf(state.pack))], { type: "application/zip" });
  if (state.downloads) {
    try { await state.downloads.save({ filename: "content.zip", data: blob }); }
    catch (err) { if (err.code !== "cancelled" && err.code !== "declined") $("packStatus").textContent = "Export failed: " + (err.code || err.message); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "content.zip"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
});

// Minimal zip: stored (uncompressed) entries to write; stored or deflated to read.
const CRC = new Uint32Array(256).map((_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
function crc32(b) { let c = 0xffffffff; for (const x of b) c = CRC[(c ^ x) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
function zip(files) {
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.path), data = enc.encode(f.text), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [14, crc, 4], [18, data.length, 4], [22, data.length, 4], [26, name.length, 2]].forEach(([o, v, s]) => s === 4 ? h.setUint32(o, v, true) : h.setUint16(o, v, true));
    const c = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [16, crc, 4], [20, data.length, 4], [24, data.length, 4], [28, name.length, 2], [42, offset, 4]].forEach(([o, v, s]) => s === 4 ? c.setUint32(o, v, true) : c.setUint16(o, v, true));
    parts.push(new Uint8Array(h.buffer), name, data); central.push(new Uint8Array(c.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const size = central.reduce((n, p) => n + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [8, files.length, 2], [10, files.length, 2], [12, size, 4], [16, offset, 4]].forEach(([o, v, s]) => s === 4 ? end.setUint32(o, v, true) : end.setUint16(o, v, true));
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)]);
}
async function unzip(b) {
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength), out = [], dec = new TextDecoder();
  let i = 0;
  while (i + 30 <= b.length && dv.getUint32(i, true) === 0x04034b50) {
    const method = dv.getUint16(i + 8, true), size = dv.getUint32(i + 18, true), nlen = dv.getUint16(i + 26, true), xlen = dv.getUint16(i + 28, true);
    const name = dec.decode(b.subarray(i + 30, i + 30 + nlen)), start = i + 30 + nlen + xlen, data = b.subarray(start, start + size);
    let bytes = data;
    if (method === 8) bytes = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
    if (!name.endsWith("/")) out.push({ path: name.split("/").pop(), text: dec.decode(bytes) });
    i = start + size;
  }
  return out;
}

// ---------- start ----------
async function boot() {
  const bytes = Uint8Array.from(atob(ENGINE_B64), c => c.charCodeAt(0));
  engine = (await WebAssembly.instantiate(bytes, {})).instance.exports;
  registry = api({ cmd: "registry" });
  schema = api({ cmd: "storylet_schema" });
  const draft = load("author.pack");
  const bundled = packFromTexts(BUNDLED);
  if (draft) { state.pack = JSON.parse(draft); state.saved = load("author.saved") || JSON.stringify(bundled); }
  else { state.pack = bundled; state.saved = packKey(); }
  if (IN_FRAME) { $("open").hidden = true; $("save").hidden = true; }
  if (window.claude && window.claude.use) {
    const [db, downloads] = await Promise.all([claude.use("db"), claude.use("downloads")]);
    state.downloads = downloads;
    if (!downloads && IN_FRAME) $("exportZip").hidden = true;
    if (db) {
      try {
        const snap = await db.collection("content").get();
        const files = snap.docs.map(d => d.data()).filter(d => d && typeof d.path === "string" && typeof d.text === "string").map(d => ({ path: d.path, text: d.text }));
        state.db = db;
        files.forEach(f => { state.written[f.path] = f.text; });
        if (files.length) { state.pack = mergeProject(bundled, files); state.saved = packKey(); }
        // A first visit with drafts from before: they become the project's.
        else if (draft) state.saved = "";
        else { textsOf(bundled).forEach(f => { state.written[f.path] = f.text; }); }
        $("projectNote").hidden = false;
        $("projectNote").textContent = "Edits save to the project automatically; Claude picks them up from there.";
        persist();
      } catch (err) { $("packStatus").textContent = "Could not reach the project's saved content: " + (err.code || err.message); }
    }
  }
  state.slot = load("author.slot") || registry.slots[0]?.id;
  state.review = load("author.review") === "1"; $("reviewMode").checked = state.review;
  state.lint = api({ cmd: "lint", pack: state.pack });
  registry = api({ cmd: "registry", pack: state.pack });
  if (!registry.slots.some(s => s.id === state.slot)) state.slot = registry.slots[0]?.id;
  renderList(); updateStatus();
  setMode(load("author.mode") || "write");
}
boot().catch(err => { $("packStatus").textContent = "The engine failed to load: " + err.message; });
</script>
