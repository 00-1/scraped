# The language bench: the engine compiled to WebAssembly behind a tiny C ABI,
# embedded in a single HTML page. Kept out of the workspace on purpose; M03
# replaces it with the `web` crate.
[package]
name = "scraped-bench"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
scraped-lang = { path = "../../crates/lang" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
