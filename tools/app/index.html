<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<title>Scraped Again</title>
<style>
/* The Android app. A chat app's shape for a reading game: a list of
   worlds like a list of conversations; in a world, the game's text set as
   prose (the way the Claude and ChatGPT apps set replies) and your
   commands as small bubbles on the right; a composer pinned above the
   keyboard with one-tap chips for what is in view. Everything around the
   game's text comes from Jb's app.label slot. */
:root {
  --bg: #f7f5ef; --surface: #fffdf8; --raised: #efece4; --ink: #22201b; --soft: #5f5a50; --faint: #8b857a;
  --rule: #e2ddd1; --accent: #8a4f1d; --on-accent: #fffaf2; --me: #e9e3d6; --agent: #dfe8e2; --scrim: rgb(20 18 14 / .42);
  --serif: "Noto Serif", "Source Serif 4", Georgia, serif;
  --sans: system-ui, "Roboto", "Segoe UI", sans-serif;
  --mono: "Roboto Mono", "Noto Sans Mono", ui-monospace, monospace;
  --read: var(--serif);
  --size: 18px;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --radius: 22px;
}
:root[data-theme="dark"] {
  --bg: #121110; --surface: #1b1a17; --raised: #24221e; --ink: #ebe6db; --soft: #b3ac9f; --faint: #857f74;
  --rule: #2f2c27; --accent: #e3a463; --on-accent: #1b1a17; --me: #2d2a24; --agent: #1f2c26; --scrim: rgb(0 0 0 / .55);
}
:root[data-theme="sepia"] {
  --bg: #f1e7d3; --surface: #f7efdf; --raised: #e8dcc4; --ink: #3b2f20; --soft: #6b5a43; --faint: #93806a;
  --rule: #dccdb0; --accent: #8d4a17; --on-accent: #fbf3e4; --me: #e3d4b6; --agent: #d7dcc4;
}
:root[data-font="sans"] { --read: var(--sans); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; overscroll-behavior: none; }
body { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 50%; color: var(--soft); }
.iconbtn:active { background: var(--raised); }
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.screen[hidden] { display: none; }
header.bar { padding: calc(var(--sat) + 4px) 4px 4px; display: flex; align-items: center; gap: 2px; min-height: calc(56px + var(--sat)); background: var(--bg); position: relative; z-index: 2; }
header.bar.lined { border-bottom: 1px solid var(--rule); }
.bar .title { flex: 1; min-width: 0; padding: 0 6px; }
.bar .title b { display: block; font-weight: 600; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .title small { display: block; color: var(--faint); font-size: .78rem; }
h1.big { font-family: var(--serif); font-weight: 600; font-size: 1.9rem; margin: 6px 16px 4px; letter-spacing: .01em; }

/* ---------- worlds ---------- */
#worldsList { flex: 1; overflow-y: auto; padding: 4px 0 calc(110px + var(--sab)); }
.world { width: 100%; display: flex; gap: 14px; align-items: center; text-align: left; padding: 12px 16px; }
.world:active { background: var(--raised); }
.avatar { flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font: 600 .95rem var(--mono); color: #fffaf0; letter-spacing: .02em; }
.world .meta { flex: 1; min-width: 0; }
.world .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.world .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.world .when { flex: none; color: var(--faint); font-size: .78rem; }
.world .preview { color: var(--soft); font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.world .tag { display: inline-block; font-size: .7rem; padding: 1px 7px; border-radius: 99px; background: var(--raised); color: var(--soft); margin-right: 6px; vertical-align: 1px; }
.empty { padding: 48px 32px; text-align: center; color: var(--faint); font-family: var(--serif); font-size: 1.05rem; }
.fab { position: fixed; right: 16px; bottom: calc(20px + var(--sab)); height: 56px; padding: 0 22px 0 18px; border-radius: 18px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; gap: 10px; font-weight: 600; box-shadow: 0 6px 18px rgb(0 0 0 / .18); }
.fab:active { transform: scale(.97); }

/* ---------- the game ---------- */
#transcript { flex: 1; overflow-y: auto; overflow-anchor: none; padding: 12px 0 8px; scroll-behavior: auto; }
.column { max-width: 40rem; margin: 0 auto; padding: 0 18px; }
.entry { animation: rise .28s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .entry { animation: none; } }
.game { font-family: var(--read); font-size: var(--size); line-height: 1.62; margin: 4px 0 18px; padding: 2px 0; border-radius: 10px; }
.game p { margin: 0 0 .7em; white-space: pre-wrap; overflow-wrap: anywhere; }
.game p:last-child { margin-bottom: 0; }
.game.open { background: var(--surface); box-shadow: 0 0 0 8px var(--surface); }
.actions { display: flex; gap: 8px; margin: -8px 0 16px; }
.actions button { font-size: .85rem; padding: 7px 14px; border-radius: 99px; background: var(--raised); color: var(--soft); }
.me { display: flex; justify-content: flex-end; margin: 6px 0 14px; }
.bubble { max-width: 82%; background: var(--me); padding: 9px 15px; border-radius: 20px 20px 6px 20px; font-family: var(--mono); font-size: calc(var(--size) * .82); line-height: 1.4; overflow-wrap: anywhere; }
.me.agent .bubble { background: var(--agent); }
.who { display: block; font: 600 .68rem var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 2px; }
#latest { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(100% + 10px); padding: 8px 16px; border-radius: 99px; background: var(--surface); color: var(--ink); box-shadow: 0 3px 12px rgb(0 0 0 / .16); font-size: .85rem; display: flex; gap: 6px; align-items: center; }
#latest[hidden] { display: none; }
footer.composer { position: relative; background: var(--bg); padding: 6px 0 calc(8px + var(--sab)); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 14px 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 7px 14px; border-radius: 99px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); font-size: .9rem; max-width: 15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.go { background: var(--raised); border-color: transparent; }
.chip.verb { color: var(--accent); border-color: transparent; background: none; font-weight: 600; padding-left: 8px; padding-right: 8px; }
.chip:active { transform: scale(.96); }
.inputrow { display: flex; align-items: flex-end; gap: 6px; padding: 0 10px 0 6px; }
.field { flex: 1; display: flex; align-items: flex-end; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); min-height: 48px; padding: 0 6px 0 4px; }
.field:focus-within { border-color: var(--accent); }
#input { flex: 1; border: 0; outline: 0; background: none; color: var(--ink); font: 1.02rem/1.4 var(--mono); padding: 13px 8px 12px; resize: none; max-height: 9.5em; min-height: 46px; }
#input::placeholder { color: var(--faint); font-family: var(--read); font-style: italic; }
#recall[hidden] { display: none; }
#recall { color: var(--faint); width: 40px; height: 46px; display: grid; place-items: center; }
#send { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; transition: opacity .15s, transform .15s; }
#send:disabled { opacity: .35; transform: scale(.92); }
#ended { margin: 0 14px 8px; padding: 12px 14px; border-radius: 16px; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
#ended[hidden] { display: none; }

/* ---------- panels and sheets ---------- */
.panel { z-index: 5; animation: slide .22s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
.scroll { flex: 1; overflow-y: auto; padding: 4px 16px calc(24px + var(--sab)); }
.card { background: var(--surface); border-radius: 18px; padding: 16px; margin: 0 auto 14px; max-width: 40rem; }
.card h2 { font-size: 1.02rem; margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.card p { color: var(--soft); margin: 0 0 12px; font-size: .92rem; line-height: 1.5; }
.btn { padding: 10px 18px; border-radius: 99px; background: var(--raised); font-weight: 600; font-size: .92rem; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.danger { color: #b3261e; }
.btn:disabled { opacity: .45; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.kv { display: grid; gap: 4px; margin: 0 0 12px; }
.kv span { font-size: .78rem; color: var(--faint); }
.kv code { font: .88rem var(--mono); background: var(--raised); padding: 8px 10px; border-radius: 10px; overflow-wrap: anywhere; user-select: all; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--rule); transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgb(0 0 0 / .3); transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
#notebookText { flex: 1; width: 100%; border: 0; outline: 0; resize: none; background: var(--surface); color: var(--ink); font: var(--size)/1.6 var(--read); padding: 16px 18px calc(16px + var(--sab)); }
#notebookText::placeholder { color: var(--faint); font-style: italic; }
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 9; animation: fade .18s; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-radius: 26px 26px 0 0; padding: 10px 18px calc(18px + var(--sab)); max-height: 88vh; overflow-y: auto; animation: up .22s ease-out; max-width: 40rem; margin: 0 auto; }
@keyframes up { from { transform: translateY(30%); opacity: .4; } }
.sheet::before { content: ""; display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--rule); margin: 0 auto 14px; }
.sheet h2 { font-size: 1.15rem; margin: 0 0 14px; }
.sheet label.lbl { display: block; font-size: .8rem; color: var(--faint); margin: 12px 0 6px; }
.seg { display: flex; background: var(--raised); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; padding: 10px 6px; border-radius: 10px; font-size: .9rem; color: var(--soft); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
.sheet input[type=text] { width: 100%; font: 1rem var(--mono); padding: 12px 14px; border-radius: 14px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); text-transform: uppercase; }
.sheet input[type=text]::placeholder { text-transform: none; font-family: var(--sans); color: var(--faint); }
.sheet .err { color: #b3261e; font-size: .85rem; margin: 6px 0 0; }
.sheet .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.menuitem { display: flex; align-items: center; gap: 16px; width: 100%; padding: 14px 6px; text-align: left; font-size: 1rem; border-radius: 12px; }
.menuitem:active { background: var(--raised); }
.menuitem .icon { color: var(--soft); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.sample { font-family: var(--read); font-size: var(--size); line-height: 1.6; margin: 10px 0 0; color: var(--soft); }
#toast { position: fixed; left: 50%; bottom: calc(96px + var(--sab)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: .9rem; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.show { opacity: 1; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); color: var(--faint); font-family: var(--serif); font-style: italic; z-index: 30; }
#loading[hidden] { display: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<section class="screen" id="worldsScreen" aria-labelledby="appTitle">
  <header class="bar">
    <div class="title"></div>
    <button class="iconbtn" id="openAppearance" data-label="appearance"><svg class="icon"><use href="#i-type"/></svg></button>
    <button class="iconbtn" id="openIntegrations" data-label="integrations"><svg class="icon"><use href="#i-plug"/></svg></button>
  </header>
  <h1 class="big" id="appTitle"></h1>
  <div id="worldsList" role="list"></div>
  <button class="fab" id="newWorld"><svg class="icon"><use href="#i-plus"/></svg><span data-text="new_world"></span></button>
</section>

<section class="screen" id="gameScreen" hidden>
  <header class="bar lined">
    <button class="iconbtn" data-act="back" data-label="back"><svg class="icon"><use href="#i-back"/></svg></button>
    <div class="title"><b id="gameTitle"></b><small id="gameSub"></small></div>
    <button class="iconbtn" id="openNotebook" data-label="notebook"><svg class="icon"><use href="#i-book"/></svg></button>
    <button class="iconbtn" id="openWorldMenu" data-label="menu"><svg class="icon"><use href="#i-more"/></svg></button>

  <main id="transcript" role="log" aria-live="polite" aria-relevant="additions"><div class="column" id="entries"></div></main>

<script>
const BUILD = __BUILD__;
const BUNDLED = __CONTENT__;
const ENGINE_B64 =
"__ENGINE__";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let engine, L = {};

// ---------- host: the Android shell, or the browser for tests ----------
const Host = (() => {
  const A = window.Android;
  const ls = { get: k => { try { return localStorage.getItem("app." + k); } catch (e) { return null; } }, put: (k, v) => { try { localStorage.setItem("app." + k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem("app." + k); } catch (e) {} } };
  return {
    native: !!A,
    get: k => A ? A.get(k) : ls.get(k),
    put: (k, v) => A ? A.put(k, v) : ls.put(k, v),
    del: k => A ? A.del(k) : ls.del(k),
    keys: () => A ? JSON.parse(A.keys()) : Object.keys(localStorage).filter(k => k.startsWith("app.")).map(k => k.slice(4)),
    haptic: () => { if (A) A.haptic(); },
    share: t => { if (A) A.share(t); else if (navigator.share) navigator.share({ text: t }).catch(() => {}); else copy(t); },
    copy: t => A ? A.copy(t) : (navigator.clipboard && navigator.clipboard.writeText(t)),
    theme: dark => { if (A) A.setDark(dark); },
    info: () => A ? JSON.parse(A.info()) : { backup: false, sync: null, agent: { on: false } },
    backupNow: () => A && A.backupNow(),
    syncChoose: () => A && A.syncChoose(),
    syncStop: () => A && A.syncStop(),
    syncWrite: data => A && A.syncWrite(data),
    restore: () => A && A.restore(),
    exportFile: (name, data) => { if (A) A.exportFile(name, data); else { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = name; a.click(); } },
    importFile: () => A && A.importFile(),
    agent: on => A ? JSON.parse(A.agent(!!on)) : { on: false },
    agentKey: () => A ? JSON.parse(A.agentKey()) : { on: false },
  };
})();

function api(req) {
  const bytes = new TextEncoder().encode(JSON.stringify(req));
  const ptr = engine.alloc(bytes.length);
  new Uint8Array(engine.memory.buffer, ptr, bytes.length).set(bytes);
  const out = engine.call(ptr, bytes.length);
  return JSON.parse(new TextDecoder().decode(new Uint8Array(engine.memory.buffer, out, engine.output_len())));
}

// ---------- state ----------
const S = { world: null, last: null, history: [], back: 0, settings: { size: 18, theme: "system", font: "serif" }, sheet: null, panels: [], openEntry: null };
const loadJSON = (k, d) => { try { const v = Host.get(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
function saveWorld(w) { w.updated = Date.now(); Host.put("w_" + w.id, JSON.stringify(w)); scheduleSync(); }
function worlds() { return Host.keys().filter(k => k.startsWith("w_")).map(k => loadJSON(k, null)).filter(Boolean).sort((a, b) => b.updated - a.updated); }

let syncTimer;
function scheduleSync() {
  if (!Host.native) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { if (Host.info().sync) Host.syncWrite(JSON.stringify(bundle())); }, 1500);
}
function bundle() { return { app: "scraped-again", version: 1, worlds: worlds(), settings: S.settings }; }

// ---------- appearance ----------
function applySettings() {
  const s = S.settings, r = document.documentElement;
  // In the app, "system" follows Android's night mode as the shell reports it.
  const night = S.night != null ? S.night : matchMedia("(prefers-color-scheme: dark)").matches;
  const dark = s.theme === "dark" || (s.theme === "system" && night);
  r.dataset.theme = s.theme === "sepia" ? "sepia" : dark ? "dark" : "light";
  r.dataset.font = s.font;
  r.style.setProperty("--size", s.size + "px");
  Host.theme(dark);
  const meta = document.querySelector('meta[name="color-scheme"]'); if (meta) meta.content = dark ? "dark" : "light";
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applySettings);

// ---------- labels ----------
function label() {
  document.title = L.app_name;
  $("appTitle").textContent = L.worlds;
  document.querySelectorAll("[data-text]").forEach(el => { el.textContent = L[el.dataset.text] || ""; });
  document.querySelectorAll("[data-label]").forEach(el => { el.setAttribute("aria-label", L[el.dataset.label] || ""); el.title = L[el.dataset.label] || ""; });
  $("input").placeholder = L.composer;

// ---------- small things ----------
let toastTimer;
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1800); }
function copy(t) { Host.copy(t); toast(L.copied); }
function hue(seed) { let h = 0; for (const c of String(seed)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; }
// The first characters of a code are its header (difficulty, length), the
// same for most worlds; the middle tells worlds apart.
function avatar(w) { const code = (w.code || "").replace(/-/g, "").slice(3); return `<span class="avatar" style="background:hsl(${hue(w.seed)} 34% 42%)" aria-hidden="true">${esc(code.slice(0, 2))}</span>`; }
function when(t) {
  const d = (Date.now() - t) / 1000;
  try {
    const f = new Intl.RelativeTimeFormat(undefined, { numeric: "auto", style: "short" });
    if (d < 60) return f.format(0, "minute");
    if (d < 3600) return f.format(-Math.round(d / 60), "minute");
    if (d < 86400) return f.format(-Math.round(d / 3600), "hour");
    if (d < 604800) return f.format(-Math.round(d / 86400), "day");
  } catch (e) {}
  return new Date(t).toLocaleDateString();
}
function lastGame(w) { for (let i = w.transcript.length - 1; i >= 0; i--) if (w.transcript[i].k === "g") return w.transcript[i].t; return ""; }
function firstLine(t) { return (t.split("\n").find(l => l.trim()) || "").trim(); }

// ---------- worlds screen ----------
function renderWorlds() {
  const list = worlds();
  $("worldsList").innerHTML = list.length ? list.map(w => `
    <button class="world" role="listitem" data-world="${esc(w.id)}">
      ${avatar(w)}
      <span class="meta">
        <span class="row1"><span class="name">${esc(L.world)} ${esc(w.code)}</span><span class="when">${esc(when(w.updated))}</span></span>
        <span class="preview">${w.ended ? `<span class="tag">${esc(L.ended)}</span>` : `<span class="tag">${esc(L.day)} ${w.day || 1}</span>`}${esc(firstLine(lastGame(w)))}</span>
      </span>
    </button>`).join("") : `<p class="empty">${esc(L.no_worlds)}</p>`;
}

// ---------- panels, sheets and back ----------
function show(id) { for (const s of ["worldsScreen", "gameScreen"]) $(s).hidden = s !== id; }
function openPanel(id) { $(id).hidden = false; S.panels.push(id); }
function closePanel() { const id = S.panels.pop(); if (id) { $(id).hidden = true; if (id === "notebookScreen") saveNotebook(); } return !!id; }
function sheet(html, onReady) {
  closeSheet();
  const scrim = document.createElement("div"); scrim.className = "scrim"; scrim.addEventListener("click", closeSheet);
  const el = document.createElement("div"); el.className = "sheet"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.innerHTML = html;
  document.body.append(scrim, el);
  S.sheet = { el, scrim };
  if (onReady) onReady(el);
  const f = el.querySelector("[autofocus], button, input"); if (f) f.focus({ preventScroll: true });
  return el;
}
function closeSheet() { if (!S.sheet) return false; S.sheet.el.remove(); S.sheet.scrim.remove(); S.sheet = null; return true; }
// The Android back button and gesture.
window.__back = () => {
  if (closeSheet()) return true;
  if (closePanel()) return true;
  if (!$("gameScreen").hidden) { leaveWorld(); return true; }
  return false;
};

// ---------- a new world ----------
function newWorldSheet() {
  let difficulty = "standard";
  sheet(`<h2>${esc(L.new_world)}</h2>
    <label class="lbl">${esc(L.difficulty)}</label>
    <div class="seg" role="group" aria-label="${esc(L.difficulty)}">${["gentle", "standard", "archaeologist"].map(d => `<button type="button" data-diff="${d}" aria-pressed="${d === difficulty}">${esc(L[d])}</button>`).join("")}</div>
    <label class="lbl" for="codeField">${esc(L.code_hint)}</label>
    <input type="text" id="codeField" spellcheck="false" autocapitalize="characters" autocomplete="off">
    <p class="err" id="codeErr" hidden>${esc(L.code_bad)}</p>
    <div class="row"><button class="btn" data-act="closeSheet">${esc(L.cancel)}</button><button class="btn primary" id="beginBtn">${esc(L.begin)}</button></div>`, el => {
    el.addEventListener("click", e => {
      const d = e.target.closest("[data-diff]");
      if (d) { difficulty = d.dataset.diff; el.querySelectorAll("[data-diff]").forEach(b => b.setAttribute("aria-pressed", String(b === d))); }
      if (e.target.id === "beginBtn") {
        const code = $("codeField").value.trim();
        let seed, diff = difficulty;
        if (code) {
          const r = api({ cmd: "seed_decode", code });
          if (r.error) { $("codeErr").hidden = false; return; }
          seed = r.seed; diff = r.difficulty;
        } else {
          seed = api({ cmd: "fair_seed", seed: String(Math.floor(Math.random() * 1e9)), difficulty }).seed;
        }
        closeSheet();
        createWorld(seed, diff);
      }
    });
  });
}
function busy(on) { $("loading").hidden = !on; }
function createWorld(seed, difficulty) {
  busy(true);
  setTimeout(() => {
    const first = api({ cmd: "play_new", seed, difficulty, files: BUNDLED });
    const code = api({ cmd: "play_code" }).code;
    const w = { id: Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36), seed, difficulty, code, save: api({ cmd: "play_save" }), transcript: [{ k: "g", t: first.text }], notebook: "", created: Date.now(), updated: Date.now(), day: 1, ended: false, state: first.state };
    saveWorld(w);
    S.world = w; S.last = first;
    enterWorld();
    busy(false);
  }, 30);
}

// ---------- in a world ----------
function openWorld(id) {
  const w = loadJSON("w_" + id, null); if (!w) return;
  busy(true);
  setTimeout(() => {
    const r = api({ cmd: "play_load", files: BUNDLED, save: w.save });
    S.world = w;
    S.last = { state: r.state || w.state };
    enterWorld();
    busy(false);
  }, 30);
}
function enterWorld() {
  const w = S.world;
  S.history = w.transcript.filter(e => e.k !== "g").map(e => e.t); S.back = 0;
  $("gameTitle").textContent = `${L.world} ${w.code}`;
  sub();
  $("entries").innerHTML = "";
  w.transcript.forEach(e => addEntry(e, false));
  renderChips();
  $("ended").hidden = !w.ended;
  show("gameScreen");
  requestAnimationFrame(() => { scrollToEnd(); });
  updateSend();
}
function leaveWorld() { saveNotebook(); show("worldsScreen"); renderWorlds(); $("input").blur(); }
function sub() { const w = S.world; $("gameSub").textContent = `${L.day} ${w.day || 1} · ${L[w.difficulty] || ""}`; }
function paragraphs(t) { return t.split(/\n{2,}/).map(p => p.replace(/^[ \t]+/, "")).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join(""); }
function addEntry(e, animate) {
  const box = $("entries");
  const div = document.createElement("div");
  if (e.k === "g") {
    div.className = "game entry"; div.innerHTML = paragraphs(e.t); div.tabIndex = 0; div.dataset.index = box.children.length;
  } else {
    div.className = "me entry" + (e.k === "a" ? " agent" : "");
    div.innerHTML = `<span class="bubble"><span class="${e.k === "a" ? "who" : "vh"}">${esc(e.k === "a" ? L.agent : L.you)}</span>${esc(e.t)}</span>`;
  }
  if (!animate) div.style.animation = "none";
  box.append(div);
}
function nearEnd() { const t = $("transcript"); return t.scrollHeight - t.scrollTop - t.clientHeight < 80; }
function scrollToEnd(smooth) { const t = $("transcript"); t.scrollTo({ top: t.scrollHeight, behavior: smooth ? "smooth" : "auto" }); $("latest").hidden = true; }
$("transcript").addEventListener("scroll", () => { if (nearEnd()) $("latest").hidden = true; });

/** One command, from the player ("y") or an agent ("a"). Returns the game's reply. */
function act(cmd, who) {
  const w = S.world; if (!w || !cmd.trim()) return "";
  cmd = cmd.trim();
  const follow = nearEnd() || who === "y";
  const r = api({ cmd: "play", line: cmd });
  const text = r.error ? "" : r.text;
  w.transcript.push({ k: who, t: cmd }, { k: "g", t: text });
  w.save = api({ cmd: "play_save" });
  w.state = r.state;
  w.day = r.state ? Math.floor(r.state.minutes / 1440) + 1 : w.day;
  if (r.state && r.state.dead && !w.ended) w.ended = true;
  saveWorld(w);
  S.last = r;
  if (who === "y") { S.history.push(cmd); S.back = 0; }
  addEntry({ k: who, t: cmd }, true);
  addEntry({ k: "g", t: text }, true);
  renderChips(); sub();
  $("ended").hidden = !w.ended;
  // Follow the newest text, as chat apps do, and again once the entries'
  // rise animation has settled.
  if (follow) { requestAnimationFrame(() => scrollToEnd()); setTimeout(() => scrollToEnd(), 320); } else $("latest").hidden = false;
  return text;
}

// ---------- chips: one tap for what is in view ----------
function lastWord(name) { const w = name.trim().split(/\s+/); return w[w.length - 1].replace(/[^\p{L}\p{N}_-]/gu, ""); }
function renderChips() {
  const st = (S.last && S.last.state) || {};
  const chips = [];
  chips.push(`<button class="chip go" data-cmd="look">look</button>`);
  const outside = st.place === "outside";
  for (const e of (st.exits || []).slice(0, 10)) chips.push(`<button class="chip go" data-cmd="${esc(outside ? "go " + lastWord(e) : e)}">${esc(e)}</button>`);
  if (!outside) chips.push(`<button class="chip go" data-cmd="out">out</button>`);
  for (const v of ["read", "take", "examine"]) chips.push(`<button class="chip verb" data-verb="${v}">${v}</button>`);
  for (const t of (st.things || []).slice(0, 12)) chips.push(`<button class="chip" data-word="${esc(lastWord(t))}">${esc(t)}</button>`);
  for (const c of ["inventory", "status", "wait"]) chips.push(`<button class="chip go" data-cmd="${c}">${c}</button>`);
  $("chips").innerHTML = chips.join("");
  $("chips").scrollLeft = 0;
}
// Command words are the game's own verbs (crates/game/data/verbs.toml), so
// they stay as they are: they are what the parser reads.
$("chips").addEventListener("pointerdown", e => { if (e.target.closest(".chip")) e.preventDefault(); });
$("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  Host.haptic();
  const input = $("input");
  if (c.dataset.cmd) { act(c.dataset.cmd, "y"); return; }
  if (c.dataset.verb) { const rest = input.value.replace(/^\s*(read|take|examine)\b\s*/i, ""); input.value = c.dataset.verb + " " + rest; }
  if (c.dataset.word) { const v = input.value.trimEnd(); input.value = (v ? v + " " : "examine ") + c.dataset.word; }
  grow(); updateSend();
  input.focus({ preventScroll: true });
  input.setSelectionRange(input.value.length, input.value.length);
});

// ---------- the composer ----------
function grow() { const i = $("input"); i.style.height = "auto"; i.style.height = Math.min(i.scrollHeight, 160) + "px"; }
function updateSend() { const has = $("input").value.trim().length > 0; $("send").disabled = !has; $("recall").hidden = has || !S.history.length; }
$("input").addEventListener("input", () => { grow(); updateSend(); });
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  if ((e.key === "ArrowUp" || e.key === "ArrowDown") && (!$("input").value || S.back)) { e.preventDefault(); recall(e.key === "ArrowUp" ? 1 : -1); }
});
// Keep the keyboard up: the send button never takes focus from the box.
$("send").addEventListener("pointerdown", e => e.preventDefault());
$("recall").addEventListener("pointerdown", e => e.preventDefault());
$("composer").addEventListener("submit", e => { e.preventDefault(); submit(); });
function submit() {
  const v = $("input").value.trim(); if (!v) return;
  Host.haptic();
  $("input").value = ""; grow(); updateSend();
  act(v, "y");
}
function recall(dir) {
  const h = S.history; if (!h.length) return;
  S.back = Math.max(0, Math.min(h.length, S.back + (dir || 1)));
  $("input").value = S.back ? h[h.length - S.back] : "";
  grow(); updateSend();
}
$("recall").addEventListener("click", () => { recall(1); $("input").focus({ preventScroll: true }); });
$("latest").addEventListener("click", () => scrollToEnd(true));
// When the keyboard opens or closes, keep the newest text in view.
let lastH = innerHeight;
const onResize = () => { const h = window.visualViewport ? visualViewport.height : innerHeight; if (h < lastH && !$("gameScreen").hidden && nearEndBefore) scrollToEnd(); lastH = h; };
let nearEndBefore = true;
$("input").addEventListener("focus", () => { nearEndBefore = nearEnd(); setTimeout(() => { if (nearEndBefore) scrollToEnd(); }, 250); });
(window.visualViewport || window).addEventListener("resize", onResize);

// ---------- passages: tap for copy and notebook ----------
$("entries").addEventListener("click", e => {
  const g = e.target.closest(".game"); if (!g) return;
  if (window.getSelection && String(getSelection()).length) return;
  const was = S.openEntry;
  document.querySelectorAll(".actions").forEach(a => a.remove());
  document.querySelectorAll(".game.open").forEach(x => x.classList.remove("open"));
  S.openEntry = null;
  if (was === g) return;
  S.openEntry = g; g.classList.add("open");
  const bar = document.createElement("div"); bar.className = "actions";
  bar.innerHTML = `<button data-pass="copy">${esc(L.copy)}</button><button data-pass="note">${esc(L.to_notebook)}</button>`;
  g.after(bar);
});
$("entries").addEventListener("click", e => {
  const b = e.target.closest("[data-pass]"); if (!b) return;
  e.stopPropagation();
  const text = S.openEntry ? S.openEntry.innerText.trim() : "";
  if (b.dataset.pass === "copy") copy(text);
  if (b.dataset.pass === "note") { const w = S.world; w.notebook = (w.notebook ? w.notebook.replace(/\s*$/, "") + "\n\n" : "") + text.split("\n").map(l => "> " + l).join("\n") + "\n"; saveWorld(w); toast(L.added); }
  document.querySelectorAll(".actions").forEach(a => a.remove());
  document.querySelectorAll(".game.open").forEach(x => x.classList.remove("open"));
  S.openEntry = null;
});

// ---------- notebook ----------
let noteTimer;
function openNotebook() {
  const w = S.world; if (!w) return;
  $("notebookText").value = w.notebook || "";
  $("notebookSub").textContent = `${L.world} ${w.code}`;
  openPanel("notebookScreen");
  setTimeout(() => $("notebookText").focus(), 60);
}
function saveNotebook() { const w = S.world; if (!w || $("notebookScreen").hidden && !noteTimer) return; clearTimeout(noteTimer); noteTimer = null; if (w.notebook !== $("notebookText").value) { w.notebook = $("notebookText").value; saveWorld(w); } }
$("notebookText").addEventListener("input", () => { clearTimeout(noteTimer); noteTimer = setTimeout(saveNotebook, 600); });

// ---------- a world's menu ----------
function worldMenu(id) {
  const w = id ? loadJSON("w_" + id, null) : S.world; if (!w) return;
  const item = (act, icon, text, cls) => `<button class="menuitem ${cls || ""}" data-wact="${act}"><svg class="icon"><use href="#i-${icon}"/></svg>${esc(text)}</button>`;
  sheet(`<h2>${esc(L.world)} ${esc(w.code)}</h2>

}

$("integrations").addEventListener("click", e => {
  const b = e.target.closest("[data-int]"); if (!b) return;

  if (k === "restore") Host.restore();

});
$("integrations").addEventListener("change", e => { if (e.target.id === "agentSwitch") { Host.agent(e.target.checked); renderIntegrations(); } });

/** Worlds from a synced or exported file: newer copies win. */
function importBundle(data) {
  let n = 0;
  try {
    const b = typeof data === "string" ? JSON.parse(data) : data;
    for (const w of b.worlds || []) {
      if (!w || !w.id || !w.save) continue;
      const have = loadJSON("w_" + w.id, null);
      if (!have || (w.updated || 0) >= (have.updated || 0)) { Host.put("w_" + w.id, JSON.stringify(w)); n++; }
    }
  } catch (e) { toast(L.sync_failed); return; }
  renderWorlds(); toast(L.restored);
}

// Events from the Android shell.
window.hostEvent = ev => {
  if (typeof ev === "string") ev = JSON.parse(ev);
  if (ev.type === "insets") { document.documentElement.style.setProperty("--sat", ev.top + "px"); document.documentElement.style.setProperty("--sab", ev.bottom + "px"); if (ev.ime && !$("gameScreen").hidden) setTimeout(() => scrollToEnd(), 30); }
  if (ev.type === "sync") { if (ev.ok) scheduleSync(); else toast(L.sync_failed); if (!$("integrationsScreen").hidden) renderIntegrations(); }
  if (ev.type === "restore" || ev.type === "import") { if (ev.ok) importBundle(ev.data); else toast(L.sync_failed); }
  if (ev.type === "night") { S.night = !!ev.dark; applySettings(); }
  if (ev.type === "agent") { if (!$("integrationsScreen").hidden) renderIntegrations(); }
};

// The agent's side: it sees only the game's text and types commands.
window.__agentAct = cmd => {
  if (!S.world) { const list = worlds(); if (!list.length) return ""; openWorldNow(list[0].id); }
  return act(String(cmd).slice(0, 400), "a");
};
window.__agentRead = n => {
  const w = S.world || worlds()[0]; if (!w) return "";
  return w.transcript.slice(-(n || 12)).map(e => e.k === "g" ? e.t : "> " + e.t).join("\n\n");
};
function openWorldNow(id) { const w = loadJSON("w_" + id, null); if (!w) return; const r = api({ cmd: "play_load", files: BUNDLED, save: w.save }); S.world = w; S.last = { state: r.state || w.state }; }

// ---------- wiring ----------
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.act === "back") window.__back();
  if (t.dataset.act === "closeSheet") closeSheet();
  if (t.dataset.act === "newWorld" || t.id === "newWorld") newWorldSheet();
  if (t.dataset.world) openWorld(t.dataset.world);
  if (t.id === "openNotebook") openNotebook();
  if (t.id === "openWorldMenu") worldMenu();
  if (t.id === "openAppearance") appearanceSheet();
  if (t.id === "openIntegrations") { renderIntegrations(); openPanel("integrationsScreen"); }
});
// Long-press a world for its menu.
let pressTimer;
$("worldsList").addEventListener("pointerdown", e => { const b = e.target.closest("[data-world]"); if (!b) return; pressTimer = setTimeout(() => { pressTimer = "fired"; Host.haptic(); worldMenu(b.dataset.world); }, 520); });
["pointerup", "pointercancel", "pointerleave"].forEach(ev => $("worldsList").addEventListener(ev, () => { if (pressTimer !== "fired") clearTimeout(pressTimer); }));
$("worldsList").addEventListener("click", e => { if (pressTimer === "fired") { e.stopImmediatePropagation(); e.preventDefault(); pressTimer = null; } }, true);
$("worldsList").addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("keydown", e => { if (e.key === "Escape") window.__back(); });

async function boot() {
  S.settings = Object.assign(S.settings, loadJSON("settings", {}));
  if (Host.native) S.night = !!Host.info().night;
  applySettings();
  const bytes = Uint8Array.from(atob(ENGINE_B64), c => c.charCodeAt(0));
  engine = (await WebAssembly.instantiate(bytes, {})).instance.exports;
  L = api({ cmd: "app_labels", files: BUNDLED });
  label();
  renderWorlds();
  show("worldsScreen");
  busy(false);
  if (window.Android && Android.ready) Android.ready();
}
boot().catch(err => { $("loading").textContent = err.message; }); // DEBUG-TEXT
</script>
