[workspace]
resolver = "2"
members = ["crates/content", "crates/lang", "crates/world", "crates/sim", "crates/game", "crates/play", "crates/cli", "crates/web", "crates/android"]

[workspace.package]
edition = "2021"
version = "0.4.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
rand_chacha = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde"] }

# Small, fast WebAssembly for the browser tools; harmless for the CLI.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# The player program (C01): optimised, symbols stripped.
# cargo build --profile player -p scraped-play --bin scraped-player --no-default-features
[profile.player]
inherits = "release"
strip = true
