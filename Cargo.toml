[workspace]
resolver = "2"
members = ["crates/lang", "crates/cli"]
exclude = ["tools/bench"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
rand_chacha = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
