[workspace]
resolver = "2"
members = ["crates/content", "crates/lang", "crates/world", "crates/game", "crates/play", "crates/cli", "crates/web"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
rand_chacha = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

# Small, fast WebAssembly for the browser tools; harmless for the CLI.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
