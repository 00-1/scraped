notes = "Short responses: carrying things, moving, the parser, time, help and saving."

[[variant]]
slot = "say.inventory"
text = "[if count > 0]You carry {list items}.[else]You carry nothing.[end]"
example = true

[[variant]]
slot = "say.take"
text = "You take {thing}."
example = true

[[variant]]
slot = "say.take_fixed"
text = "{cap thing} will not move."
example = true

[[variant]]
slot = "say.take_held"
text = "You already have {thing}."
example = true

[[variant]]
slot = "say.drop"
text = "You put down {thing}."
example = true

[[variant]]
slot = "say.drop_unheld"
