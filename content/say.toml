example = true

[[variant]]
slot = "say.wait"
text = "You wait {duration minutes}."
example = true

[[variant]]
slot = "say.help"
text = '''
Try: look, examine (x) something, go to a building or anything you can see, north, ne, up, out,
head north, follow the river downstream, go back, name this place the gap, go to the gap,
open and close doors, take, drop, inventory (i), read something, read closely,
examine sign 3, trace sign 3, wait.'''
example = true

[[variant]]
slot = "say.intro"
text = "You wake in {a biome}, among old buildings. Writing is everywhere, and you cannot read it."
example = true

