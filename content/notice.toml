# Ways of noticing (D13): the style offered at the start, the style chosen,
# and a kind of noticing sharpening through habit.

[[variant]]
slot = "style.offer"
text = "Before this, were you a scribe, a forager, a mason or a wayfarer? Or none of these."
example = true

[[variant]]
slot = "style.chosen"
text = "[if style == 'scribe']Your eye goes to marks and their shapes.[else][if style == 'forager']Your eye goes to what grows and moves.[else][if style == 'mason']Your eye goes to stone, joints and wear.[else][if style == 'wayfarer']Your eye goes to the lie of the land and the sky.[else]You'll see what you see.[end][end][end][end]"
example = true

[[variant]]
slot = "notice.sharpened"
text = "You find yourself noticing more of it now."
example = true

[[variant]]
slot = "suggest.verb"
text = "You could {words}."
example = true

[[variant]]
slot = "spell.sign"
text = "[if category == 'sounds']The {thing} sounds wrong here.[else][if category == 'smells']The smell of the {thing} is wrong here.[else][if category == 'life']The {thing} behaves oddly here.[else][if category == 'buildings']Something in the stone here is not right.[else][if category == 'land']The {thing} lies oddly here.[else]Something about the {thing} is off.[end][end][end][end][end]"
example = true

[[variant]]
slot = "clock.sundial"
text = "[if shown]Lines are cut across the face, {of} of them. The shadow lies on line {part}, counting from the morning side.[else]Lines are cut across the face, {of} of them. There is no shadow to read.[end]"
example = true

[[variant]]
slot = "clock.water"
text = "Water drips from it into a basin marked inside with {of} rings. It stands at ring {part}."
example = true
