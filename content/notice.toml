# Ways of noticing (D13): the style offered at the start, the style chosen,
# and a kind of noticing sharpening through habit.

[[variant]]
slot = "style.offer"
text = "Before this, were you a scribe, a forager, a mason or a wayfarer? Or none of these."
example = true

[[variant]]
slot = "style.chosen"
text = "[if style == 'scribe']Your eye goes to marks and their shapes.[else][if style == 'forager']Your eye goes to what grows and moves.[else][if style == 'mason']Your eye goes to stone, joints and wear.[else][if style == 'wayfarer']Your eye goes to the lie of the land and the sky.[else]You'll see what you see.[end][end][end][end]"
example = true

[[variant]]
slot = "notice.sharpened"
text = "You find yourself noticing more of it now."
example = true

[[variant]]
slot = "suggest.verb"
text = "You could {words}[if thing] the {thing}[end]."
example = true

[[variant]]
slot = "spell.sign"
text = "[if category == 'sounds']The {thing} sounds wrong here.[else][if category == 'smells']The smell of the {thing} is wrong here.[else][if category == 'life']The {thing} behaves oddly here.[else][if category == 'buildings']Something in the stone here is not right.[else][if category == 'land']The {thing} lies oddly here.[else]Something about the {thing} is off.[end][end][end][end][end]"
example = true

[[variant]]
slot = "clock.sundial"
text = "[if shown]Lines are cut across the face, {of} of them. The shadow lies on line {part}, counting from the morning side.[else]Lines are cut across the face, {of} of them. There is no shadow to read.[end]"
example = true

[[variant]]
slot = "clock.water"
text = "Water drips from it into a basin marked inside with {of} rings. It stands at ring {part}."
example = true

[[variant]]
slot = "arc.step"
text = "[if large]Something has changed.[else]A small thing, but yours.[end]"
example = true

[[variant]]
slot = "settle.not_yet"
text = "[if reason == 'no_camp']There is nothing here to stay for yet.[else][if reason == 'no_store']Not with so little laid by.[else]Not here, not yet.[end][end]"
example = true

[[variant]]
slot = "feed.animal"
text = "[if takes][if follows]The {kind} takes it from your hand, and stays close.[else]The {kind} snatches it and backs off.[end][else]The {kind} won't come near the food.[end]"
example = true

[[variant]]
slot = "feed.no_animal"
text = "Nothing close enough to feed."
example = true

[[variant]]
slot = "feed.no_food"
text = "You have nothing to give the {kind}."
example = true

[[variant]]
slot = "end.arc"
text = "[if arc == 'forager']Off the land[else][if arc == 'mason']In stone and works[else][if arc == 'wayfarer']On the roads[else]In the marks[end][end][end], you went some way[if large > 0], and made something of it[end]."
example = true

[[variant]]
slot = "companion.warns"
text = "The {kind} at your heel goes stiff and growls."
example = true
