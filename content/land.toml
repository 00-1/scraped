notes = "The land outdoors: weather, the ground underfoot, edges, landmarks and the view."

[[variant]]
slot = "land.edge_name"
text = "the {kind}"
example = true

[[variant]]
slot = "land.edge"
text = "{name}[if side == 'here'] runs here[else] lies to the {side}[end]"
example = true

[[variant]]
slot = "land.name"
text = "the {mark}[if mark2 != \"\"] {mark2}[end] {kind}"
example = true

[[variant]]
slot = "land.landmark"
text = "{name} to the {bearing} ({distance})"
example = true

[[variant]]
slot = "land.region"
text = "From up here the land spreads out: mostly {main}.[if sea] The sea is in view.[end]"
example = true

[[variant]]
slot = "land.ground"
text = "{cap biome}, [if terrain == 'flat']flat ground[else]{terrain} ground[end][if high], high up[end]."
example = true

[[variant]]
slot = "land.unseen"
text = "[if light == 'dark']Darkness hides anything further off.[else]The {weather} hides the distance.[end]"
example = true

[[variant]]
slot = "land.feature"
text = "[if plural]{cap kind}[else]{cap a kind}[end][if bearing == 'here'] here[else] to the {bearing}[end]"
example = true

[[variant]]
slot = "land.feature_name"
text = "the {kind}"
example = true
