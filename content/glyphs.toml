notes = "How glyphs of the ancient script are described. The player never sees a glyph, only these words, so they must be exact enough to draw."

[[variant]]
slot = "glyph.stroke"
text = "{a stroke}[if turn != 'none'] turned {turn}[end], {spot}"
example = true

[[variant]]
slot = "glyph.describe"
text = "{cap list strokes}."
example = true

[[variant]]
slot = "glyph.impression"
text = "[if like]like {like}, with {list added}[else]{a outline} sign, {a main}[if main_turn != 'none'] turned {main_turn}[end][if main_spot != 'none'] at the {main_spot}[end][if resembles] like {a resembles}[end][if others], with {list others}[end][end]"
example = true
