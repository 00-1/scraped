notes = "How glyphs of the ancient script are described. The player never sees a glyph, only these words, so they must be exact enough to draw."

[[variant]]
slot = "glyph.stroke"
text = "{a stroke}[if turn != 'none'] turned {turn}[end], {spot}"
example = true

[[variant]]
slot = "glyph.describe"
text = "{cap list strokes}."
example = true

[[variant]]
slot = "glyph.part"
text = "{a part}[if place != 'none'] {place}[end][if facing] facing {facing}[end]"
example = true

[[variant]]
slot = "glyph.impression"
text = "[if like]like [if like_sound]the «{like_sound}» sign[else][if like_resembles]the {like_resembles} sign[else]{like}[end][end], with {list added}[else]{a proportion}, {curve} sign[if resembles] like {a resembles}[end][if parts], with {list parts}[end][if pieces], pieces: {pieces}[end][if holes], closed spaces: {holes}[end][if symmetry], even {symmetry}[end][if busy], {busy}[end][if leans], leaning {leans}[end][if weight], {weight}[end][if sits], sitting {sits}[end][if runs], running {runs}[end][end]"
example = true
