notes = "The end of a run: other endings than death, and the summary of what it came to."

[[variant]]
slot = "end.summary"
text = "Your time here is over, after {count days day}. You walked {walked} {plural kilometre walked}, entered {places} {plural building places} of {kinds} {plural kind kinds}, found {secrets} hidden {plural thing secrets}[if rim] and reached the end of the land[end], read {read} {plural text read}, wrote {wrote} and scraped {released}."
example = true

[[variant]]
slot = "end.left"
text = "The last strokes come away, and the world lets you go."
example = true

[[variant]]
slot = "end.written_in"
text = "As the blade lifts, you feel yourself set into the stone, one more layer among the rest."
example = true

[[variant]]
slot = "end.old_age"
text = "At {years}, your days run out."
example = true

[[variant]]
slot = "end.overtaken"
text = "The ground gives way beneath you, and the land takes you with it."
example = true

[[variant]]
slot = "end.region"
text = "[if count > 1]In {count} regions[else]In one region[end] ({list bearings}), {aspect}: {before} then, {after} now[if cause == 'you'], by your hand[end][if cause == 'both'], partly your doing[end]."
example = true

[[variant]]
slot = "end.calm"
text = "The land is much as you found it."
example = true

[[variant]]
slot = "end.act"
text = "Day {day}: you {act} a push on the {aspect} to the {bearing}."
example = true

[[variant]]
slot = "end.chronicle"
text = "Later hands wrote of you, in {words} words:"
example = true

[[variant]]
slot = "end.beyond"
text = "You walk on past the last of the land, and do not come back."
example = true
