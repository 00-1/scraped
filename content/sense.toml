notes = "The senses: what listening, smelling, touching, tasting and looking up or down give."

[[variant]]
slot = "sense.sound"
text = "[if strength == 'faint']Faintly, [end][if source == 'call']a {call}[else]{source}[end][if name != ''] ({name})[end][if bearing != 'here'] from the {bearing}[end]."
example = true

[[variant]]
slot = "sense.silence"
text = "You hear nothing but your own breath."
example = true

[[variant]]
slot = "sense.smell"
text = "[if strength == 'faint']A faint smell of [else]A smell of [end]{source}[if bearing != 'here'], from the {bearing}[end]."
example = true

[[variant]]
slot = "sense.no_smell"
text = "You smell nothing worth noting."
example = true

[[variant]]
slot = "sense.touch"
text = "{cap thing} feels {texture}, {temperature}[if wetness != 'dry'] and {wetness}[end].[if marks] Your fingers find marks cut into it.[end]"
example = true

[[variant]]
slot = "sense.touch_air"
text = "The air is {temperature}[if air != 'still'] and {air}[end]; the ground is {wetness}."
example = true

[[variant]]
slot = "sense.taste"
text = "[if taste == 'nothing']It tastes of nothing.[else]It tastes of {taste}.[end]"
example = true

[[variant]]
slot = "sense.sky"
text = "[if weather == 'fog']Grey fog above.[else]The sky: {sky}.[end][if birds] Birds wheel overhead.[end]"
example = true

[[variant]]
slot = "sense.ground"
text = "[if indoors]The floor is {wetness}.[else]{cap terrain} {biome} underfoot, {wetness}.[end]"
example = true
