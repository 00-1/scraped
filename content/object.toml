notes = "Objects with histories (D05): found things, their emblems and close details."

[[variant]]
slot = "object.examine"
text = "{cap a2 material kind}[if condition != 'whole'], {condition}[end].[if emblem] It bears {emblem}.[end][if numeral] It is marked with {numeral}, and weighs about {heft} of the smallest.[end]"
example = true

[[variant]]
slot = "object.closer"
text = "Looking closer: [if maker]a maker's mark, {maker}; [end]the rim in a {border} style[if condition == 'mended'], and an old repair[end]."
example = true

[[variant]]
slot = "emblem.describe"
text = "[if device == 'in a ring']{a motif} in a ring[else][if device == 'on a bar']{a motif} on a bar[else][if device == 'single']{a motif}[else]{a device} {motif}[end][end][end][if border != 'none'] in a {border} border[end]"
example = true

[[variant]]
slot = "object.not_open"
text = "{cap thing} doesn't open."
example = true

[[variant]]
slot = "object.locked"
text = "{cap thing} is locked. The lock bears {emblem}."
example = true

[[variant]]
slot = "object.unlocked"
text = "The key turns in {thing}."
example = true

[[variant]]
slot = "door.unlocked"
text = "Your key turns in the lock of {thing}."
example = true

[[variant]]
slot = "object.opened"
text = "You open {thing}.[if count > 0] Inside: {list contents}.[else] It is empty.[end]"
example = true

[[variant]]
slot = "cache.sign"
text = "[if place == 'floor']A floor stone[else]A stone in the wall[end] is cut with {emblem}"
example = true

[[variant]]
slot = "cache.found"
text = "Under the stone marked with {emblem}: {thing}"
example = true

[[variant]]
slot = "dig.found"
text = "You dig, and turn up {list things}."
example = true

[[variant]]
slot = "dig.nothing"
text = "[if indoors]There's nowhere to dig here.[else]You dig a while and find nothing.[end]"
example = true

[[variant]]
slot = "map.read"
text = "An old map, its edge in a {border} style.[if places] It shows {list places}.[end][if cross] A cross is drawn to the {cross_bearing}[if cross_by], by {a cross_by}[end].[end]"
example = true

[[variant]]
slot = "map.place"
text = "a town to the {bearing}"
example = true

[[variant]]
slot = "mech.idle"
text = "The {kind} won't move.[if family == 'water'] The channel by it is dry.[else] The rope to it hangs slack.[end]"
example = true

[[variant]]
slot = "works.done"
text = "Somewhere in the building, something heavy grinds upward and stops."
example = true

[[variant]]
slot = "calendar.notch"
text = "A ring of marks for the days. One notch, {part} in {season}, is cut deeper than the rest.[if today] The light falls on it now.[end]"
example = true
