notes = "Objects with histories (D05): found things, their emblems and close details."

[[variant]]
slot = "object.examine"
text = "{cap a material} {kind}[if condition != 'whole'], {condition}[end].[if emblem] It bears {emblem}.[end]"
example = true

[[variant]]
slot = "object.closer"
text = "Looking closer: [if maker]a maker's mark, {maker}; [end]the rim in a {border} style[if condition == 'mended'], and an old repair[end]."
example = true

[[variant]]
slot = "emblem.describe"
text = "{a device} {motif}[if border != 'none'] in a {border} border[end]"
example = true
