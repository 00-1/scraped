notes = "Reading: the frame around a text, each glyph, and paging."

[[variant]]
slot = "read.frame"
text = "On {thing}, {count glyphs noun}[if pages > 1] (page {page} of {pages})[end]:"
example = true

[[variant]]
slot = "read.glyph"
text = "{number}. [if heard]«{sound}»[else]{impression}[end]"
example = true

[[variant]]
slot = "read.more"
text = "(There is more.)"
example = true

[[variant]]
slot = "read.end"
text = "That is all of it."
example = true

[[variant]]
slot = "read.nothing"
text = "There are no marks on {thing}."
example = true

[[variant]]
slot = "read.no_more"
text = "You aren't looking at any marks."
example = true

[[variant]]
slot = "read.dark"
text = "It is too dark to make out the marks on {thing}."
example = true

[[variant]]
slot = "read.lost"
text = "{number}. (worn away)"
example = true

[[variant]]
slot = "read.scraped"
text = "Some of these marks were scraped away; {lost} of them are lost."
example = true

[[variant]]
slot = "read.ghosts"
text = "Fainter marks lie beneath."
example = true

[[variant]]
slot = "read.deep"
text = "Beneath it, fainter, another layer shows through the lens."
example = true

[[variant]]
slot = "read.legacy"
text = "The oldest of the faint layers is in a hand that seems strangely familiar."
example = true

[[variant]]
slot = "read.whole"
text = "On {thing}, {count glyphs noun} in {count words group}, about {count lines line}, in a {hand} hand.[if form == 'sealed'] A seal is pressed at the foot.[end][if form == 'columns'] The {plural noun 2} stand in columns.[end][if recurring] A few shapes keep coming back.[end][if others] Other {plural noun 2} share it: {list others}.[end]"
example = true

[[variant]]
slot = "read.no_piece"
text = "There is nothing more beneath these."
example = true

[[variant]]
slot = "trace.no_tool"
text = "You have nothing to copy these onto."
example = true

[[variant]]
slot = "sign.name"
text = "{noun} {number}"
example = true

[[variant]]
slot = "trace.frame"
text = "You take [if from == to]{noun} {from}[else]{plural noun 2} {from} to {to}[end] of {thing}[if with == 'pressing'], pressing clay into it[else], rubbing charcoal over it[end] ({how_long}):"
example = true

[[variant]]
slot = "trace.sign"
text = "{number}. {description}"
example = true

[[variant]]
slot = "trace.lost"
text = "{number}. (too far gone to trace)"
example = true

[[variant]]
slot = "trace.more"
text = "({count remaining noun} left.)"
example = true

[[variant]]
slot = "trace.dark"
text = "There isn't light enough to trace by."
example = true

[[variant]]
slot = "glyph.heard"
text = "As the strokes come away, something faint, almost a voice: «{list sounds}»."
example = true

[[variant]]
slot = "read.grime"
text = "{cap cover} hides some of the {plural noun 2}."
example = true

[[variant]]
slot = "read.seal"
text = "At the foot of the marks on {thing}, a round seal is pressed into the {material}."
example = true

