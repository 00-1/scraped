text = "[if need == 'warmth'][if worse]You shiver.[else]Warmth comes back into your hands.[end][end][if need == 'thirst'][if worse]Your mouth is dry.[else]Your thirst eases.[end][end][if need == 'hunger'][if worse]Your stomach aches with hunger.[else]Your hunger fades.[end][end][if need == 'rest'][if worse]Your limbs are heavy.[else]You feel rested.[end][end][if need == 'injury'][if worse]Pain flares.[else]The pain dulls.[end][end][if need == 'wet'][if worse]Water soaks through your clothes.[else]You are drying out.[end][end]"
example = true

