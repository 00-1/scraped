notes = "The physical signs of writing taking effect. Never say what the writing said."

[[variant]]
slot = "effect.change"
text = "Something changes: the {property} of the {class} [if rising]rises[else]falls[end]."
example = true

[[variant]]
slot = "effect.held"
text = "{cap thing} will not move."
example = true

[[variant]]
slot = "effect.fast"
text = "[if how == 'heavy']{cap thing} will not lift, as if rooted.[else]{cap thing} will not come away from where it lies.[end]"
example = true

[[variant]]
slot = "clean.done"
text = "You rub the {cover} from {thing}."
example = true

[[variant]]
slot = "clean.nothing"
text = "There is nothing to clean from {thing}."
example = true
