[package]
name = "scraped-cli"
description = "Terminal tool for inspecting languages generated by scraped-lang."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "scraped-lang"
path = "src/main.rs"

[dependencies]
scraped-lang = { path = "../lang" }
serde_json.workspace = true
scraped-content = { path = "../content" }
serde.workspace = true
scraped-world = { path = "../world" }
scraped-game = { path = "../game" }
