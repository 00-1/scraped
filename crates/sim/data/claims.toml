[[tag]]
tags = ["thing", "vessel", "food", "tool", "material", "made", "good", "weapon", "metal", "cloth", "writing_thing", "money"]
class = "thing"

[[tag]]
tags = ["person", "title", "kin", "group", "being"]
class = "person"

# The qualities each class takes. Heat is in degrees (a plain claim adds
# 12); every other quality is a direction and a strength (1 to 3).

[[class]]
class = "passage"
qualities = ["openness", "heat", "stability", "binding", "visibility", "sound", "weight"]

[[class]]
class = "room"
qualities = ["heat", "light", "wetness", "sound", "keeping", "stability", "calm", "visibility", "lure"]

[[class]]
class = "structure"
qualities = ["stability", "heat", "weight", "visibility", "wetness", "light"]

[[class]]
class = "land"
qualities = ["heat", "light", "wetness", "growth", "lure", "calm", "sound", "stability", "visibility", "rising"]

[[class]]
class = "water"
qualities = ["flow", "wetness", "heat", "rising", "light", "sound", "calm"]

[[class]]
class = "plant"
qualities = ["growth", "keeping", "wetness", "heat", "light", "lure"]

[[class]]
class = "animal"
qualities = ["lure", "calm", "sound", "visibility", "rising", "binding", "weight"]

[[class]]
class = "thing"
qualities = ["weight", "keeping", "heat", "light", "binding", "visibility", "openness", "wetness", "rising", "sound", "stability"]

[[class]]
class = "air"
qualities = ["heat", "light", "wetness", "flow", "sound", "rising", "visibility", "calm"]

[[class]]
class = "person"
qualities = ["openness"]
