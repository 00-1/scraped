[[tag]]
tags = ["openable"]
class = "passage"

[[tag]]
tags = ["building", "enterable", "home"]
class = "room"

[[tag]]
tags = ["water", "liquid"]
class = "water"

[[tag]]
tags = ["plant", "tree", "shrub", "flowering", "grassy", "waterplant", "moss", "fungus", "climber", "plantpart"]
class = "plant"

[[tag]]
tags = ["animal", "bird", "fishkind", "insect"]
class = "animal"

[[tag]]
tags = ["heaven", "air", "light", "cold"]
class = "air"

[[tag]]
tags = ["landform", "ground", "settlement", "way", "edge", "high", "low", "crossing", "hollow"]
