# What potent writing acts on (D09): the classes of things a spell's target
# can be, and which qualities each class can take.
#
# A potent inscription is a claim: a change (from the power of its verb, or
# of what its verb gives or takes away; see crates/lang/data/powers.toml)
# made to a target ("let the gate open", "let the house not burn", "let the
# granary keep the grain"). Once scraped, the world makes the claim true
# near the surface it was written on, if the target's class can take that
# quality; otherwise the claim is vague and does nothing.
#
# `subject` names a concept's class outright; other concepts take a class
# from their tags (`tag`). `class` lists the qualities each class takes.
#
# Classes:   passage (doors, gates, lids), room (indoors), land (open
#            ground), structure (stone and walls), water (rivers, wells,
#            springs), plant, animal, thing (what can be carried), air
#            (sky and weather), person (who may pass).

[[subject]]
id = "gate"
class = "passage"

[[subject]]
id = "door"
class = "passage"

[[subject]]
id = "tomb"
class = "passage"

# DESIGN-Q: a box is treated as a passage (its lid) until containers exist.
[[subject]]
