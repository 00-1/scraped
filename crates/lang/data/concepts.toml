# Starter concept list for Milestone 1.
#
# Every language generated from a seed gets one root per concept here.
# Fields:
#   id        unique gloss used in interlinear glosses (lowercase, no spaces)
#   domain    people | nature | places | objects | actions | qualities | deixis | numbers | grammar
#   pos       noun | verb | adj | num | det | adv | particle
#   tags      (nouns) semantic tags used by inscription templates to pick sensible words
#   objects   (verbs) tags an object noun must carry (any one); empty = intransitive
#   applies   (adjectives) tags a noun must carry (any one) for the adjective to modify it
#   value     (numbers) numeric value
#   needs     (numbers) only in languages whose numeral base is listed:
#             decimal | duodecimal | vigesimal | quinary. Empty = always.
#   en_*      English forms for the placeholder translation, only where the regular rule fails
#
# Tags are a stand-in for real semantics until world generation exists.

