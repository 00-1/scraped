[package]
name = "scraped-game"
description = "Game state, parser and actions for Scraped Again."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
scraped-content = { path = "../content" }
scraped-lang = { path = "../lang" }
scraped-sim = { path = "../sim" }
scraped-world = { path = "../world" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[features]
# Debug and spoiler output: ground truth, the facts weighed, slot traces.
# The player build (`scraped-player`) leaves it out, so they don't exist.
default = ["spoilers"]
spoilers = []
