# The verbs the parser knows. Each verb has an id (used in code) and the
# words a player may type for it; multi-word forms are matched first.
# Later milestones add verbs here (scrape, write, name) without code changes
# to the parser.
#
#   object = "none" | "optional" | "required"

[[verb]]
id = "look"
words = ["look", "l", "look around"]
object = "none"

[[verb]]
id = "examine"
words = ["examine", "x", "inspect", "look at", "l at", "study"]
object = "required"

[[verb]]
id = "go"
words = ["go", "walk", "go to", "walk to", "go into", "go through", "enter", "travel to", "make for"]
object = "required"

[[verb]]
id = "out"
words = ["out", "leave", "exit", "go out", "outside"]
object = "none"

[[verb]]
id = "take"
words = ["take", "get", "pick up", "grab", "carry"]
object = "required"

[[verb]]
id = "drop"
words = ["drop", "put down", "leave behind"]
object = "required"

[[verb]]
id = "read"
words = ["read", "r"]
object = "required"

[[verb]]
id = "more"
words = ["more", "next", "read on", "continue"]
object = "none"

[[verb]]
id = "inventory"
words = ["inventory", "i", "inv"]
object = "none"

[[verb]]
id = "wait"
words = ["wait", "z", "rest"]
object = "none"

[[verb]]
id = "define"
words = ["define", "transliterate", "label", "call"]
object = "required"

[[verb]]
id = "help"
words = ["help", "?", "h"]
object = "none"

[[verb]]
id = "head"
words = ["head", "head for", "head towards", "head toward", "walk towards", "set off"]
object = "required"

[[verb]]
id = "follow"
words = ["follow", "walk along", "go along", "keep to"]
object = "required"

[[verb]]
id = "back"
words = ["back", "go back", "retrace", "retrace my steps", "retrace your steps", "return"]
object = "none"

[[verb]]
id = "name"
words = ["name", "name this place", "call this place", "name this spot", "call this spot", "name here"]
object = "required"

